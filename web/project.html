<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 - Slide Studio</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/xml-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchtags.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<style>
html, body { height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; }
.masthead { flex-shrink: 0; }
.masthead.nav-locked { opacity: .55; filter: blur(1.5px); pointer-events: none; }
main.content { flex: 1; min-height: 0; display: flex; }

.project-layout { flex: 1; min-height: 0; width: 100%; display: grid; grid-template-columns: 240px 1fr; gap: 0; background: var(--surface-card); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.slide-sidebar { height: 100%; background: var(--surface); border-right: 1px solid var(--border); padding: 16px 0; overflow-y: auto; }
.slide-sidebar.nav-locked { opacity: .55; filter: blur(1.5px); pointer-events: none; }
.slide-list-item {
  display: flex; flex-direction: column; gap: 6px; padding: 8px 16px; cursor: pointer;
  color: var(--text-muted); font-size: 13px; transition: background 0.15s;
  border-left: 3px solid transparent;
}
.slide-list-item:hover { background: var(--surface-card); }
.slide-list-item.active { background: var(--rh-red-tint); border-left-color: var(--rh-red); color: var(--text); }
.slide-thumb {
  width: 100%; aspect-ratio: 16 / 9; background: #fff; border: 1px solid var(--border);
  border-radius: 3px; overflow: hidden; position: relative; pointer-events: none;
}
.slide-thumb iframe {
  width: 960px; height: 540px; border: none; position: absolute; top: 0; left: 0;
  transform-origin: top left;
}
.slide-row { display: flex; align-items: center; gap: 10px; width: 100%; }
.slide-num { font-weight: 700; color: var(--rh-red); min-width: 24px; text-align: center; font-size: 12px; }
.slide-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.slide-actions { display: flex; gap: 2px; flex-shrink: 0; opacity: 0; transition: opacity .15s; }
.slide-list-item:hover .slide-actions, .slide-list-item.active .slide-actions { opacity: 1; }
.slide-action-btn {
  width: 18px; height: 18px; border: none; background: transparent; color: var(--text-muted);
  font-size: 12px; cursor: pointer; border-radius: 3px; display: flex; align-items: center;
  justify-content: center; padding: 0; line-height: 1; flex-shrink: 0;
}
.slide-action-btn:hover { background: rgba(0,0,0,.08); color: var(--text); }
.slide-action-btn:disabled { opacity: .3; cursor: default; }
.slide-action-btn:disabled:hover { background: transparent; color: var(--text-muted); }
.slide-action-btn.slide-action-danger:hover { background: var(--danger-bg); color: var(--danger); }
.slide-list-item[draggable="true"] { cursor: grab; }
.slide-list-item.dragging { opacity: .4; }
.slide-list-item.drag-over-top { box-shadow: inset 0 2px 0 0 var(--rh-red); }
.slide-list-item.drag-over-bottom { box-shadow: inset 0 -2px 0 0 var(--rh-red); }

.slide-insert-zone {
  height: 16px; margin: -8px 0; position: relative; z-index: 2; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.slide-insert-zone.slide-insert-zone-end { height: 20px; margin: 4px 0 0; }
.slide-insert-zone::before {
  content: ''; position: absolute; left: 16px; right: 16px; top: 50%; height: 2px;
  background: var(--rh-red); transform: translateY(-50%); opacity: 0; transition: opacity .12s;
}
.slide-insert-zone .zone-plus {
  display: none; position: relative; width: 18px; height: 18px; border-radius: 50%;
  background: var(--rh-red); box-shadow: 0 1px 4px rgba(0,0,0,.3);
}
.slide-insert-zone .zone-plus::before,
.slide-insert-zone .zone-plus::after {
  content: ''; position: absolute; top: 50%; left: 50%; background: #fff; border-radius: 1px;
  transform: translate(-50%, -50%);
}
.slide-insert-zone .zone-plus::before { width: 8px; height: 2px; }
.slide-insert-zone .zone-plus::after { width: 2px; height: 8px; }
.slide-insert-zone:hover::before { opacity: 1; }
.slide-insert-zone:hover .zone-plus { display: block; }

.present-overlay {
  display: none; position: fixed; inset: 0; z-index: 5000; background: #000;
  align-items: center; justify-content: center;
}
.present-overlay.open { display: flex; }
.present-overlay iframe { width: 960px; height: 540px; border: none; background: #fff; transform-origin: center center; }
.present-close, .present-nav {
  position: absolute; z-index: 5001; background: rgba(255,255,255,.12); color: #fff; border: none;
  border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.present-close:hover, .present-nav:hover { background: rgba(255,255,255,.25); }
.present-close { top: 20px; right: 20px; width: 36px; height: 36px; font-size: 16px; }
.present-nav { top: 50%; transform: translateY(-50%); width: 48px; height: 48px; font-size: 26px; }
.present-prev { left: 20px; }
.present-next { right: 20px; }
.present-counter {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 5001;
  color: #fff; font-size: 13px; background: rgba(255,255,255,.12); padding: 4px 12px; border-radius: 12px;
}

.modal-overlay {
  position: fixed; inset: 0; z-index: 4000; background: rgba(0,0,0,.5);
  display: flex; align-items: center; justify-content: center;
}
.modal-box {
  background: var(--surface-card); border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,.3);
  display: flex; flex-direction: column; max-height: 80vh;
}
.assets-modal { width: 640px; }
.modal-header {
  flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); padding: 4px 8px 4px 16px;
}
.modal-tabs { display: flex; gap: 0; }
.modal-tab {
  padding: 12px 16px; cursor: pointer; color: var(--text-muted); font-size: 13px; font-weight: 600;
  border: none; background: none; border-bottom: 2px solid transparent; font-family: inherit;
}
.modal-tab.active { color: var(--rh-red); border-bottom-color: var(--rh-red); }
.modal-close {
  border: none; background: none; cursor: pointer; color: var(--text-muted); font-size: 16px;
  width: 32px; height: 32px; border-radius: 4px;
}
.modal-close:hover { background: var(--surface); color: var(--text); }
.modal-body { flex: 1; overflow-y: auto; padding: 16px; }
.assets-search-row { display: flex; gap: 8px; margin-bottom: 12px; }
.assets-search-row input[type="text"] {
  flex: 1; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border-strong);
  border-radius: 4px; font-size: 13px; font-family: inherit;
}
.assets-file-list { display: flex; flex-direction: column; gap: 6px; }
.assets-file-row {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border);
  border-radius: 4px; font-size: 12px;
}
.assets-file-row .af-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.assets-file-row .af-size { color: var(--text-muted); flex-shrink: 0; }
.assets-file-row button {
  border: none; background: var(--surface); color: var(--text-muted); cursor: pointer;
  border-radius: 3px; padding: 4px 8px; font-size: 11px; flex-shrink: 0;
}
.assets-file-row button:hover { background: var(--rh-red-tint); color: var(--rh-red); }
.assets-empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 24px 0; }
.assets-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.assets-grid-item {
  border: 1px solid var(--border); border-radius: 6px; overflow: hidden; cursor: pointer;
  background: var(--surface); display: flex; flex-direction: column;
}
.assets-grid-item:hover { border-color: var(--rh-red); }
.assets-grid-item img { width: 100%; height: 70px; object-fit: contain; background: #fff; display: block; }
.assets-grid-item .agi-label {
  font-size: 10px; color: var(--text-muted); padding: 4px 6px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}

.slide-main { height: 100%; min-height: 0; overflow: hidden; box-sizing: border-box; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; background: var(--surface-card); }
.toolbar {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px; flex-wrap: wrap;
}
.toolbar.nav-locked, .viewer-toolbar.nav-locked, .ai-edit-bar.nav-locked, .html-accordion.nav-locked {
  opacity: .55; filter: blur(1.5px); pointer-events: none;
}
/* Only the slide content blurs — a filter on .preview-container itself
   would blur the "AI 반영중" overlay sitting on top of it too. */
.preview-container.nav-locked #previewFrame, .preview-container.nav-locked #previewEmpty {
  opacity: .55; filter: blur(1.5px); pointer-events: none;
}
.ai-processing-overlay {
  display: none; position: absolute; inset: 0; z-index: 20;
  flex-direction: column; align-items: center; justify-content: center; gap: 12px;
}
.preview-container.nav-locked .ai-processing-overlay { display: flex; }
.ai-processing-spinner {
  width: 32px; height: 32px; border-radius: 50%;
  border: 3px solid var(--rh-red-tint, rgba(238,0,0,.2)); border-top-color: var(--rh-red);
  animation: ai-processing-spin .8s linear infinite;
}
@keyframes ai-processing-spin { to { transform: rotate(360deg); } }
.ai-processing-text { font-size: 13px; font-weight: 700; color: var(--text); }
.toolbar .btn { font-size: 13px; padding: 7px 14px; }
.toolbar .status-badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase;
  border: 1px solid transparent;
}
.status-draft { background: #F6F6F6; color: var(--text-muted); border-color: var(--border); }
.status-generating { background: var(--warning-bg); color: var(--warning); }
.status-completed { background: var(--success-bg); color: var(--success); }
.status-building { background: var(--rh-red-tint); color: var(--rh-red-dark); }
.status-failed { background: var(--danger-bg); color: var(--danger); }

.tab-bar { flex-shrink: 0; display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 0; }
.tab-bar.nav-locked { opacity: .55; filter: blur(1.5px); pointer-events: none; }
.tab-btn {
  padding: 8px 18px; cursor: pointer; color: var(--text-muted); font-size: 13px;
  border-bottom: 2px solid transparent; transition: all 0.15s; background: none; border-top: none; border-left: none; border-right: none;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--rh-red); border-bottom-color: var(--rh-red); }

#slideTab { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.preview-container {
  flex: 1; min-height: 0; width: 100%; box-sizing: border-box; background: #fff;
  border: 1px solid var(--border-strong); border-radius: 4px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.preview-container iframe {
  width: 960px; height: 540px; border: none; background: #fff;
  transform-origin: center center;
  overflow: hidden;
}
.preview-empty { color: var(--text-muted); font-size: 14px; }

.html-accordion { flex-shrink: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--surface); }
.html-accordion-header {
  display: flex; align-items: center; gap: 8px; padding: 10px 16px; cursor: pointer;
  font-size: 13px; font-weight: 700; color: var(--text); user-select: none;
}
.html-accordion-header .chevron { transition: transform .15s; color: var(--text-muted); }
.html-accordion.open .html-accordion-header { border-bottom: 1px solid var(--border); }
.html-accordion.open .html-accordion-header .chevron { transform: rotate(90deg); }
.html-dirty-dot {
  display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--rh-red); flex-shrink: 0;
}
.html-dirty-dot.show { display: inline-block; }
.html-accordion-body { display: none; flex-direction: column; gap: 8px; height: 360px; padding: 0 16px 12px; box-sizing: border-box; }
.html-accordion.open .html-accordion-body { display: flex; }
.html-accordion-body .CodeMirror {
  flex: 1; min-height: 0; height: 100%; width: 100%;
  border: 1px solid var(--border-strong); border-radius: 4px;
  font-family: 'Red Hat Mono', monospace; font-size: 12px; line-height: 1.5;
}
.html-accordion-body .CodeMirror-activeline-background { background: var(--rh-red-tint); }

.resize-handle {
  flex-shrink: 0; height: 12px; margin: 0 -16px; cursor: row-resize;
  display: flex; align-items: center; justify-content: center; position: relative;
}
.resize-handle::after {
  content: ''; width: 36px; height: 4px; border-radius: 2px; background: var(--border-strong);
  transition: background .15s;
}
.resize-handle:hover::after { background: var(--rh-red); }

.viewer-toolbar {
  flex-shrink: 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  padding: 10px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
}
.viewer-toolbar .btn {
  height: 30px; box-sizing: border-box; font-size: 12px; padding: 0 10px;
  display: inline-flex; align-items: center; gap: 6px; line-height: 1;
}
.viewer-toolbar .btn svg { width: 14px; height: 14px; flex-shrink: 0; }

.ai-edit-bar {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
}
.ai-edit-bar svg { color: var(--rh-red); flex-shrink: 0; }
.ai-edit-bar input[type="text"] {
  flex: 1; box-sizing: border-box; padding: 7px 10px; border: 1px solid var(--border-strong);
  border-radius: 4px; font-size: 12.5px; font-family: inherit; margin: 0;
}
.ai-edit-bar .btn { font-size: 12.5px; padding: 7px 14px; flex-shrink: 0; }

.content-editor { flex: 1; min-height: 0; display: none; flex-direction: column; }
.content-editor textarea {
  flex: 1; min-height: 0; width: 100%; box-sizing: border-box; padding: 16px;
  background: #fff; color: var(--text); border: 1px solid var(--border-strong);
  border-radius: 4px; font-family: 'Red Hat Mono', monospace; font-size: 13px; line-height: 1.6; resize: none;
}
.section-header { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.section-header h3 { margin: 0; font-size: 14px; color: var(--text); }
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-brand">
    <a href="/" class="masthead-home-link" id="homeLink">
      <span class="rh-mark"></span>
      <span class="masthead-title">Slide Studio</span>
    </a>
    <span class="masthead-context" id="projectTitle">프로젝트</span>
  </div>
  <nav class="masthead-nav">
    <a href="/" class="masthead-nav-link" id="dashboardLink">대시보드</a>
  </nav>
  <div class="nav-user" id="navUser"></div>
</div>

<main class="content" style="padding:0; max-width:none;">
  <div class="project-layout">
    <!-- Sidebar: slide list -->
    <div class="slide-sidebar">
      <div style="padding:0 16px 12px; border-bottom:1px solid var(--border); margin-bottom:8px;">
        <h3 style="margin:0 0 4px; font-size:13px; color:var(--text);">슬라이드</h3>
        <div style="font-size:11px; color:var(--text-muted);" id="slideCount">0장</div>
      </div>
      <div id="slideList"></div>
    </div>

    <!-- Main area -->
    <div class="slide-main">
      <div class="toolbar">
        <span class="status-badge" id="statusBadge">DRAFT</span>
        <div style="flex:1"></div>
        <button class="btn" id="buildBtn" onclick="buildPptx()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M4 4h16v16H4z"/><path d="M9 9h6v6H9z"/></svg>
          PPTX 빌드
        </button>
        <button class="btn" id="downloadBtn" onclick="downloadPptx()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          다운로드
        </button>
        <button class="btn" id="exportHtmlBtn" onclick="exportHtml()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M16 18l6-6-6-6"/><path d="M8 6l-6 6 6 6"/></svg>
          HTML 내보내기
        </button>
        <button class="btn" id="exportPdfBtn" onclick="exportPdf()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          PDF 내보내기
        </button>
        <button class="btn" id="presentBtn" onclick="enterPresentMode()" disabled title="프레젠테이션 모드 (F)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          프레젠테이션
        </button>
        <button class="btn btn-danger" onclick="deleteProject()">삭제</button>
      </div>

      <div class="warning-box" id="buildWarning" style="display:none; margin:0;"></div>

      <!-- Tabs -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="slide" onclick="switchTab('slide')">슬라이드</button>
        <button class="tab-btn" data-tab="content" onclick="switchTab('content')">Content.md</button>
      </div>

      <!-- Slide: viewer toolbar + preview + collapsible raw-HTML editor -->
      <div id="slideTab">
        <div class="viewer-toolbar" id="viewerToolbar">
          <button class="btn" id="undoBtn" onclick="revertUnsavedChanges()" disabled title="저장하지 않은 변경사항을 마지막 저장 상태로 되돌리기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3.5-7.1"/><path d="M3 4v5h5"/></svg>
            전체 되돌리기
          </button>
          <input type="file" id="assetUploadInput" accept="image/*" style="display:none">
          <div style="flex:1"></div>
          <span class="html-dirty-dot" id="htmlDirtyDot" title="저장되지 않은 변경사항"></span>
          <button class="btn btn-primary" id="saveSlideBtn" onclick="saveSlideHtml()" disabled>저장</button>
        </div>

        <div class="preview-container" id="previewContainer">
          <div class="preview-empty" id="previewEmpty">슬라이드를 선택하세요.</div>
          <iframe id="previewFrame" style="display:none"></iframe>
          <div class="ai-processing-overlay" id="aiProcessingOverlay">
            <div class="ai-processing-spinner"></div>
            <div class="ai-processing-text">AI 반영중</div>
          </div>
        </div>

        <div class="ai-edit-bar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4L12 3z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z"/></svg>
          <input type="text" id="aiEditInput" placeholder="AI에게 이 슬라이드 수정 요청 (예: 제목을 더 크게 해줘)">
          <button class="btn btn-primary" id="aiEditBtn" onclick="applyAiEdit()">AI 수정</button>
        </div>

        <div class="html-accordion" id="htmlAccordion">
          <div class="html-accordion-header" onclick="toggleHtmlEditor()">
            <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            <span id="htmlEditorTitle">HTML 편집</span>
          </div>
          <div class="html-accordion-body">
            <div class="resize-handle" id="resizeHandle" title="드래그해서 높이 조절"></div>
            <textarea id="htmlEditor" spellcheck="false"></textarea>
          </div>
        </div>
      </div>

      <!-- Content Editor -->
      <div class="content-editor" id="contentTab">
        <div class="section-header">

async function loadProject(autoSelect = true) {
  // Slide filenames get reassigned to different content by the server on
  // every add/delete/reorder (renumbering keeps them contiguous, and the
  // footer "N / total" text on every OTHER slide gets rewritten too) — a
  // thumbnail cached under a filename before any of that can now be
  // showing a different slide's content entirely. Cheap to refetch, so
  // just drop the whole cache here instead of trying to reason about which
  // entries are still valid.
  for (const k in thumbHtmlCache) delete thumbHtmlCache[k];
  const res = await fetch('/api/projects/' + projectName);
  if (!res.ok) { window.location.href = '/'; return; }
  project = await res.json();
  document.getElementById('projectTitle').textContent = project.title;
  document.title = project.title + ' - Slide Studio';
  updateStatusBadge(project.status);

  const hasSlides = !!(project.slides && project.slides.length > 0);
  document.getElementById('buildBtn').disabled = !hasSlides;
  document.getElementById('downloadBtn').disabled = !project.has_pptx;
  document.getElementById('exportHtmlBtn').disabled = !hasSlides;
  document.getElementById('exportPdfBtn').disabled = !hasSlides;
  document.getElementById('presentBtn').disabled = !hasSlides;

  const warningEl = document.getElementById('buildWarning');
  const warningText = project.build_warning || project.generation_warning;
  if (warningText) {
    warningEl.textContent = warningText;
    warningEl.style.display = 'block';
  } else {
    warningEl.style.display = 'none';
  }

  const slides = project.slides || [];
  document.getElementById('slideCount').textContent = slides.length + '장';
  const list = document.getElementById('slideList');
  // Reuse existing rows (keyed by filename) and reposition them with
  // appendChild instead of tearing the whole list down (list.innerHTML='')
  // and rebuilding it every render — loadProject() re-renders this on
  // every reorder/insert/delete, and innerHTML='' actually detaches every
  // child first (destroying each row's thumbnail <iframe> and its loaded
  // content) even for rows we meant to keep, which is what made every
  // thumbnail go blank and reordering feel slow/flickery. appendChild on a
  // node that's already in the list *moves* it in place without ever
  // detaching it, so a reused row's iframe keeps its already-rendered
  // content across the reorder.
  const existingItems = {};
  list.querySelectorAll('.slide-list-item').forEach((el) => { existingItems[el.dataset.filename] = el; });
  const keepFilenames = new Set(slides);
  Object.keys(existingItems).forEach((fn) => { if (!keepFilenames.has(fn)) existingItems[fn].remove(); });
  list.querySelectorAll('.slide-insert-zone').forEach((z) => z.remove());
  slides.forEach((s, i) => {
    list.appendChild(createInsertZone(i));
    let item = existingItems[s];
    if (item) {
      item.className = 'slide-list-item' + (currentSlide === s ? ' active' : '');
      item.querySelector('.slide-num').textContent = i + 1;
    } else {
      item = document.createElement('div');
      item.className = 'slide-list-item' + (currentSlide === s ? ' active' : '');
      item.dataset.filename = s;
      item.innerHTML =
        '<div class="slide-thumb"><iframe scrolling="no"></iframe></div>' +
        '<div class="slide-row">' +
          '<span class="slide-num">' + (i+1) + '</span>' +
          '<span class="slide-name">' + s.replace('.html','') + '</span>' +
          '<span class="slide-actions">' +
            '<button class="slide-action-btn" title="위로">↑</button>' +
            '<button class="slide-action-btn" title="아래로">↓</button>' +
            '<button class="slide-action-btn slide-action-danger" title="삭제">×</button>' +
          '</span>' +
        '</div>';
      renderSlideThumb(item.querySelector('.slide-thumb'), s);
    }
    item.dataset.index = i;
    item.onclick = () => selectSlide(s);
    const [upBtn, downBtn, delBtn] = item.querySelectorAll('.slide-action-btn');
    upBtn.disabled = i === 0;
    downBtn.disabled = i === slides.length - 1;
    upBtn.onclick = (e) => moveSlide(i, -1, e);
    downBtn.onclick = (e) => moveSlide(i, 1, e);
    delBtn.onclick = (e) => deleteSlide(s, e);
    attachSlideDragHandlers(item);
    list.appendChild(item);
  });
  list.appendChild(createInsertZone(slides.length, true));

  if (autoSelect && slides.length > 0 && !currentSlide) selectSlide(slides[0]);

  if (project.status === 'generating') {
    setTimeout(loadProject, 3000);
  }
}

// Drag the handle at the top of the HTML editor to resize it against the
// preview above — independent of the accordion's own collapse/expand toggle.
(function setupResizeHandle() {
  const handle = document.getElementById('resizeHandle');
  const body = document.querySelector('.html-accordion-body');
  let dragging = false;
  let startY = 0;
  let startHeight = 0;

  handle.addEventListener('mousedown', (e) => {
    dragging = true;
    startY = e.clientY;
    startHeight = body.getBoundingClientRect().height;
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const delta = startY - e.clientY; // drag up = grow the editor
    const slideTab = document.getElementById('slideTab');
    const maxHeight = slideTab.clientHeight - 160; // keep some room for the preview
    const newHeight = Math.min(Math.max(startHeight + delta, 140), Math.max(maxHeight, 140));
    body.style.height = newHeight + 'px';
    htmlCM.setSize(null, '100%');
    fitPreviewFrame();
  });

  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    document.body.style.userSelect = '';
    htmlCM.refresh();
  });
})();

    if (!m) return '#000000';
    return '#' + m.slice(0, 3).map(function (x) {
      var h = parseInt(x, 10).toString(16);
      return h.length === 1 ? '0' + h : h;

      // showToolbar() rebuild — recreating the toolbar and all 8 resize
      // handles on every single mousemove event was expensive enough to
      // make dragging visibly stutter instead of tracking the cursor.
      dragChromeStart = null;
      if (toolbar && selected === dragEl) {
        dragChromeStart = {
          toolbarLeft: parseFloat(toolbar.style.left) || 0,
          toolbarTop: parseFloat(toolbar.style.top) || 0,
          handles: resizeHandleEls.map(function (h) { return {el: h, left: parseFloat(h.style.left) || 0, top: parseFloat(h.style.top) || 0}; }),
        };
      }
    }
    var left = e.clientX - dragOffX - dragBox.left;
    var top = e.clientY - dragOffY - dragBox.top;
    dragEl.style.left = ((left / dragBox.width) * 100).toFixed(3) + '%';
    dragEl.style.top = ((top / dragBox.height) * 100).toFixed(3) + '%';
    if (dragChromeStart) {
      var dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
      toolbar.style.left = (dragChromeStart.toolbarLeft + dx) + 'px';
      toolbar.style.top = (dragChromeStart.toolbarTop + dy) + 'px';
      dragChromeStart.handles.forEach(function (h) {
        h.el.style.left = (h.left + dx) + 'px';
        h.el.style.top = (h.top + dy) + 'px';
      });
    }
  });
  document.addEventListener('mouseup', function () {
    if (dragEl && dragMoved) {
      syncBack();
      // One full rebuild now that dragging is done — re-clamps the toolbar
      // to the viewport, refreshes the overflow warning, and re-derives
      // exact handle positions instead of the cheap translation used above.
      if (selected === dragEl) showToolbar(dragEl);
    }
    dragEl = null;
    dragMoved = false;
    dragChromeStart = null;
  });

  // Called from the parent frame while any AI-edit request (bar or popup)
  // for this slide is in flight, so the user can't select/drag anything
  // else out from under it. A full-viewport scrim below the toolbar's own
  // z-index blocks every other pointer interaction without touching each
  // handler individually.
  window.__wysiwygSetLocked = function (locked) {
    var scrim = document.getElementById('__wysiwyg_lock_scrim');
    if (locked) {
      if (!scrim) {
        scrim = document.createElement('div');
        scrim.id = '__wysiwyg_lock_scrim';
        scrim.setAttribute('data-wysiwyg-overlay', '');
        document.body.appendChild(scrim);
      }
    } else if (scrim) {
      scrim.remove();
    }
  };

  // Called from the parent frame when the user clicks anywhere outside the
  // preview iframe — a click there never reaches this document at all
  // (separate browsing context), so without this, any open toolbar/popup
  // stayed on screen forever once the user's focus moved elsewhere.
  window.__wysiwygClearSelection = function () { clearSelection(); };
})();
<\/script>
`;
}

function rewriteSlidePaths(rawHtml) {
  return rawHtml
    .replaceAll('../../../../redhat/', '/engine/redhat/')
    .replaceAll('src="assets/', 'src="/api/projects/' + projectName + '/assets/');
}

// Sidebar thumbnails — reflects the saved file, not live unsaved WYSIWYG
// edits (same contract as the reference gallery's own thumbnails). Cached
// per filename so reordering/inserting slides (which re-renders the whole
// list) doesn't re-fetch HTML for slides that haven't actually changed;
// invalidateThumb() is called wherever a slide is actually saved.
const thumbHtmlCache = {};

async function renderSlideThumb(thumbEl, filename) {
  let html = thumbHtmlCache[filename];
  if (html === undefined) {
    try {
      const res = await fetch('/api/projects/' + projectName + '/slides/' + filename + '/preview');
      html = res.ok ? await res.text() : '';
    } catch (e) { html = ''; }
    thumbHtmlCache[filename] = html;
  }
  const iframe = thumbEl.querySelector('iframe');
  if (!iframe) return; // the row may have been re-rendered away while this fetch was in flight
  iframe.srcdoc = html ? rewriteSlidePaths(html) : '';
  iframe.style.transform = 'scale(' + (thumbEl.clientWidth / 960) + ')';
}

function invalidateThumb(filename) {
  delete thumbHtmlCache[filename];
  document.querySelectorAll('.slide-list-item').forEach((item) => {
    if (item.dataset.filename === filename) renderSlideThumb(item.querySelector('.slide-thumb'), filename);
  });
}

function buildPreviewHtml(rawHtml) {
  const rewritten = rewriteSlidePaths(rawHtml);
  const palette = THEME_COLOR_PALETTES[project && project.theme] || DEFAULT_COLOR_PALETTE;
  const overlayScript = buildWysiwygOverlayScript(palette);
  return rewritten.includes('</body>')
    ? rewritten.replace('</body>', overlayScript + '</body>')
    : rewritten + overlayScript;
}

function renderPreview(rawHtml) {
  const frame = document.getElementById('previewFrame');
  frame.setAttribute('scrolling', 'no');
  frame.srcdoc = buildPreviewHtml(rawHtml);
  requestAnimationFrame(fitPreviewFrame);
}

// Called by the overlay after any font-size/color/drag change. Reverses the
// two path rewrites buildPreviewHtml() applied so what lands back in
// CodeMirror matches the stored-source format exactly.
//
// The iframe's own live DOM already reflects the change (that's what the
// overlay just mutated) — re-rendering the preview from this synced source
// would reload the iframe from scratch and wipe the overlay's selection/
// toolbar state, which is exactly what made repeated clicks (e.g. A+ A+ A+)
// so annoying. suppressNextRerender skips just that one re-render; the
// source (and dirty flag) still update normally.
let suppressNextRerender = false;
window.__wysiwygSync = function (previewHtml) {
  const restored = previewHtml
    .replaceAll('src="/api/projects/' + projectName + '/assets/', 'src="assets/')
    .replaceAll('/engine/redhat/', '../../../../redhat/');
  suppressNextRerender = true;
  htmlCM.setValue(restored); // fires 'change' -> onHtmlInput()
};

function onHtmlInput() {
  const val = htmlCM.getValue();
  setDirty(val !== originalHtml);
  if (suppressNextRerender) {
    suppressNextRerender = false;
    return;
  }
  clearTimeout(liveUpdateTimer);
  liveUpdateTimer = setTimeout(() => renderPreview(val), 250);
}

async function selectSlide(filename) {
  if (filename === currentSlide) return;
  if (blockIfAiEditBusy()) return;
  if (!confirmDiscardIfDirty()) return;

  currentSlide = filename;
  setDirty(false);
  document.querySelectorAll('.slide-list-item').forEach((el, i) => {
    el.className = 'slide-list-item' + ((project.slides || [])[i] === filename ? ' active' : '');
  });

  document.getElementById('previewEmpty').style.display = 'none';
  document.getElementById('previewFrame').style.display = 'block';
  document.getElementById('htmlEditorTitle').textContent = 'HTML 편집 — ' + filename;

  if (!previewResizeObserver) {
    previewResizeObserver = new ResizeObserver(fitPreviewFrame);
    previewResizeObserver.observe(document.getElementById('previewContainer'));
  }

  const res = await fetch('/api/projects/' + projectName + '/slides/' + filename);
  if (res.ok) {
    const data = await res.json();
    originalHtml = data.html;
    htmlCM.setValue(data.html);
    htmlCM.clearHistory();
    renderPreview(data.html);
  }
}

// "전체 되돌리기": discards every unsaved change on the CURRENTLY OPEN
// slide, back to its last-saved state (originalHtml). "전체" means "all of
// the pending edits at once", not "every slide in the project" — only the
// open slide can ever be dirty in the first place, and once it's saved
// there's nothing left to revert (setDirty() disables this button the
// moment htmlDirty goes false). Purely client-side: nothing was persisted
// yet, so there's no server call needed.
function revertUnsavedChanges() {
  if (!currentSlide || !htmlDirty) return;
  if (!confirm('저장하지 않은 변경사항을 모두 되돌립니다. 계속하시겠습니까?')) return;
  htmlCM.setValue(originalHtml);
  setDirty(false);
  renderPreview(originalHtml);
  showToast('마지막 저장 상태로 되돌렸습니다.');
}

async function deleteSlide(filename, event) {
  if (event) event.stopPropagation();
  if (blockIfAiEditBusy()) return;
  if (!confirm('"' + filename.replace('.html','') + '" 슬라이드를 삭제하시겠습니까?')) return;
  const res = await fetch('/api/projects/' + projectName + '/slides/' + filename, {method: 'DELETE'});
  if (res.ok) {
    if (currentSlide === filename) currentSlide = null;
    showToast('슬라이드를 삭제했습니다.');
    await loadProject();
  } else {
    showToast('삭제 실패', true);
  }
}

// Shared by the ↑/↓ buttons, thumbnail drag-and-drop, and insert-at-position
// — toIndex is the slide's desired FINAL index in the resulting order
// (standard splice-based array-move semantics), not an index into the
// pre-move array.
async function reorderSlideTo(fromIndex, toIndex) {
  if (blockIfAiEditBusy()) return;
  const slides = (project.slides || []).slice();
  if (fromIndex < 0 || fromIndex >= slides.length || toIndex < 0 || toIndex >= slides.length || fromIndex === toIndex) return;
  const moved = slides.splice(fromIndex, 1)[0];
  slides.splice(toIndex, 0, moved);

  const res = await fetch('/api/projects/' + projectName + '/slides/reorder', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({order: slides}),
  });
  if (!res.ok) { showToast('순서 변경 실패', true); return; }
  const data = await res.json();
  // The server renumbers slideNN-* filenames to stay contiguous, so the
  // pre-move filename ("moved") may no longer exist afterward — always
  // resolve the slide to show from the response's fresh order, not the
  // stale name we moved.
  currentSlide = null;
  await loadProject(false);
  selectSlide(data.order[toIndex]);
}

async function moveSlide(index, direction, event) {
  if (event) event.stopPropagation();
  await reorderSlideTo(index, index + direction);
}

let dragSlideIndex = null;

// Attached once per DOM node (guarded below) since list items are now
// reused across re-renders instead of being torn down and recreated every
// time — see loadProject()'s renderSlideList(). The index a node
// represents can still change across renders (reordering), so handlers
// read it fresh from item.dataset.index at event time rather than closing
// over a value that would go stale the moment two slides swap places.
function attachSlideDragHandlers(item) {
  if (item._dragHandlersAttached) return;
  item._dragHandlersAttached = true;
  item.draggable = true;
  item.addEventListener('dragstart', (e) => {
    dragSlideIndex = parseInt(item.dataset.index, 10);
    e.dataTransfer.effectAllowed = 'move';
    item.classList.add('dragging');
  });
  item.addEventListener('dragend', () => {
    item.classList.remove('dragging');
    document.querySelectorAll('.slide-list-item').forEach((el) => el.classList.remove('drag-over-top', 'drag-over-bottom'));
    dragSlideIndex = null;
  });
  item.addEventListener('dragover', (e) => {
    if (dragSlideIndex === null) return;
    e.preventDefault();
    const before = (e.clientY - item.getBoundingClientRect().top) < item.offsetHeight / 2;
    item.classList.toggle('drag-over-top', before);
    item.classList.toggle('drag-over-bottom', !before);
  });
  item.addEventListener('dragleave', () => item.classList.remove('drag-over-top', 'drag-over-bottom'));
  item.addEventListener('drop', (e) => {
    e.preventDefault();
    const before = (e.clientY - item.getBoundingClientRect().top) < item.offsetHeight / 2;
    item.classList.remove('drag-over-top', 'drag-over-bottom');
    const index = parseInt(item.dataset.index, 10);
    if (dragSlideIndex === null || dragSlideIndex === index) return;
    let to = before ? index : index + 1;
    if (dragSlideIndex < to) to -= 1; // account for the source slot disappearing once removed
    reorderSlideTo(dragSlideIndex, to);
  });
}

function createInsertZone(atIndex, isEnd) {
  const zone = document.createElement('div');
  zone.className = 'slide-insert-zone' + (isEnd ? ' slide-insert-zone-end' : '');
  zone.title = '여기에 새 슬라이드 삽입';
  zone.innerHTML = '<span class="zone-plus"></span>';
  zone.onclick = (e) => { e.stopPropagation(); insertBlankSlideAt(atIndex); };
  return zone;
}

async function insertBlankSlideAt(atIndex) {
  if (blockIfAiEditBusy()) return;
  if (!confirmDiscardIfDirty()) return;
  const res = await fetch('/api/projects/' + projectName + '/slides', {method: 'POST'});
  if (!res.ok) { showToast('추가 실패', true); return; }
  const data = await res.json();
  await loadProject(false); // refresh project.slides so it includes the new (appended) slide
  const fromIndex = project.slides.indexOf(data.filename);
  if (fromIndex !== -1 && fromIndex !== atIndex) {
    await reorderSlideTo(fromIndex, atIndex);
  } else {
    selectSlide(data.filename);
  }
  showToast('새 슬라이드를 삽입했습니다.');
}

let presentIndex = 0;

function fitPresentFrame() {
  const frame = document.getElementById('presentFrame');
  const scale = Math.max(Math.min(window.innerWidth / 960, window.innerHeight / 540), 0.1);
  frame.style.transform = 'scale(' + scale + ')';
}

function enterPresentMode() {
  if (blockIfAiEditBusy()) return;
  const slides = project && project.slides || [];
  if (!slides.length) return;
  presentIndex = Math.max(0, slides.indexOf(currentSlide));
  document.getElementById('presentOverlay').classList.add('open');
  renderPresentSlide();
  fitPresentFrame();
  const overlay = document.getElementById('presentOverlay');
  if (overlay.requestFullscreen) {
    // innerWidth/innerHeight only change once the fullscreen transition
    // actually completes, so the pre-fullscreen fitPresentFrame() call
    // above is sized for the un-fullscreened viewport — refit afterward.
    overlay.requestFullscreen().then(fitPresentFrame).catch(() => {});
  }
}

function exitPresentMode() {
  document.getElementById('presentOverlay').classList.remove('open');
  if (document.fullscreenElement) document.exitFullscreen();
}

window.addEventListener('resize', fitPresentFrame);
// Escape exits fullscreen as a browser-level safety behavior no page JS can
// intercept or prevent — relying on our own keydown handler to also notice
// Escape and close the overlay was unreliable. Reacting to the fullscreen
// state itself instead: whenever fullscreen ends while still "presenting",
// close the overlay too, regardless of what caused the exit (Escape, F11,
// browser UI).
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && document.getElementById('presentOverlay').classList.contains('open')) {
    exitPresentMode();
  }
});

function presentStep(delta) {
  const slides = project && project.slides || [];
  const next = presentIndex + delta;
  if (next < 0 || next >= slides.length) return;
  presentIndex = next;
  renderPresentSlide();
}

async function renderPresentSlide() {
  const slides = project && project.slides || [];
  const filename = slides[presentIndex];
  if (!filename) return;
  document.getElementById('presentCounter').textContent = (presentIndex + 1) + ' / ' + slides.length;
  const res = await fetch('/api/projects/' + projectName + '/slides/' + filename + '/preview');
  const html = await res.text();
  // No WYSIWYG overlay while presenting — just the rewritten asset/theme paths.
  document.getElementById('presentFrame').srcdoc = rewriteSlidePaths(html);
}

function showImageGenStub() {
  showToast('이미지 생성 기능은 준비 중입니다.');
}

async function runAiEdit(instruction, targetHtml) {
  if (!currentSlide || aiEditInProgress) return;
  const targetSlide = currentSlide; // the request is scoped to whatever slide is open right now
  aiEditInProgress = true;
  setNavigationLocked(true);
  const btn = document.getElementById('aiEditBtn');
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = '적용 중...';
  try {
    const res = await fetch('/api/projects/' + projectName + '/slides/' + targetSlide + '/ai-edit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({instruction, target_html: targetHtml || null, current_html: htmlCM.getValue()}),
    });
    const data = await res.json();
    if (res.ok) {
      if (currentSlide === targetSlide) {
        // Navigation is locked while aiEditInProgress is true, so this should
        // always hold — checked anyway in case that ever changes.
        htmlCM.setValue(data.html); // fires 'change' -> onHtmlInput() marks dirty since it differs from originalHtml
        renderPreview(data.html);
        showToast('AI 수정 결과를 반영했습니다. 확인 후 저장하세요.');
      } else {
        showToast('"' + targetSlide.replace('.html','') + '" 슬라이드의 AI 수정 결과가 준비됐지만 화면이 전환되어 반영하지 않았습니다.', true);
      }
    } else {
      showToast('AI 수정 실패: ' + (data.detail || ''), true);
      resetWysiwygBusyState();
    }
  } catch(e) {
    showToast('AI 수정 오류: ' + e.message, true);
    resetWysiwygBusyState();
  }
  aiEditInProgress = false;
  setNavigationLocked(false);
  btn.disabled = false;
  btn.textContent = original;
}

async function applyAiEdit() {
  const input = document.getElementById('aiEditInput');
  const instruction = input.value.trim();
  if (!instruction) return;
  await runAiEdit(instruction, null);
  input.value = '';
}

// Called by the WYSIWYG overlay script running inside the preview iframe
// when the user clicks "AI 수정" on a selected element.
window.__wysiwygAiEdit = function(targetOuterHtml, instruction) {
  if (!instruction) return;
  runAiEdit(instruction, targetOuterHtml);
};

// On success renderPreview() reloads the iframe, which wipes the WYSIWYG
// popup for free. On failure the iframe is untouched, so its "적용 중..."
// popup would otherwise stay stuck disabled forever — tell it to recover.
function resetWysiwygBusyState() {
  const frame = document.getElementById('previewFrame');
  const win = frame && frame.contentWindow;
  if (win && win.__wysiwygAiEditFailed) win.__wysiwygAiEditFailed();
}

function setNavigationLocked(locked) {
  document.querySelector('.masthead').classList.toggle('nav-locked', locked);
  document.querySelector('.slide-sidebar').classList.toggle('nav-locked', locked);
  document.querySelector('.tab-bar').classList.toggle('nav-locked', locked);
  document.querySelector('.toolbar').classList.toggle('nav-locked', locked);
  document.querySelector('.ai-edit-bar').classList.toggle('nav-locked', locked);
  document.querySelector('.viewer-toolbar').classList.toggle('nav-locked', locked);
  document.querySelector('.html-accordion').classList.toggle('nav-locked', locked);
  document.getElementById('previewContainer').classList.toggle('nav-locked', locked);
  // Also freeze the WYSIWYG overlay inside the preview iframe — otherwise
  // the outer chrome is locked but the user could still select/drag/add
  // elements on the slide itself while a request for it is in flight.
  const frame = document.getElementById('previewFrame');
  const win = frame && frame.contentWindow;
  if (win && win.__wysiwygSetLocked) win.__wysiwygSetLocked(locked);
}

document.getElementById('aiEditInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); applyAiEdit(); }
});

// Global shortcuts: F to present, arrows/Esc while presenting, Delete to
// remove the open slide. Disabled while focus is in a text field/CodeMirror
// so typing "f" or pressing Delete in a text box doesn't get hijacked.
function isTypingContext() {
  const el = document.activeElement;
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
}
document.addEventListener('keydown', (e) => {
  const presenting = document.getElementById('presentOverlay').classList.contains('open');
  if (presenting) {
    if (e.key === 'Escape') { e.preventDefault(); exitPresentMode(); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); presentStep(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); presentStep(-1); }
    return;
  }
  if (isTypingContext()) return;
  if (e.key === 'f' || e.key === 'F') { e.preventDefault(); enterPresentMode(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && currentSlide) { e.preventDefault(); deleteSlide(currentSlide); }
});

document.getElementById('assetUploadInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (!currentSlide) { showToast('먼저 슬라이드를 선택하세요.', true); e.target.value = ''; return; }
  const formData = new FormData();
  formData.append('file', file);
  const res = await fetch('/api/projects/' + projectName + '/assets', {method: 'POST', body: formData});
  if (res.ok) {
    const data = await res.json();
    htmlCM.replaceSelection('<img src="assets/' + data.filename + '" alt="">');
    showToast('업로드 완료 — 커서 위치에 <img> 태그를 삽입했습니다.');
    if (document.getElementById('assetsModal').style.display !== 'none') loadAssetsFileList();
  } else {
    showToast('업로드 실패', true);
  }
  e.target.value = '';
});

// ── Assets modal: 내 파일 / 로고 검색 / 사진 검색 ──

function insertAssetTag(filename) {
  if (!currentSlide) { showToast('먼저 슬라이드를 선택하세요.', true); return; }
  htmlCM.replaceSelection('<img src="assets/' + filename + '" alt="">');
  showToast('커서 위치에 <img> 태그를 삽입했습니다.');
}

function formatBytes(n) {
  if (n < 1024) return n + 'B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + 'KB';
  return (n / 1024 / 1024).toFixed(1) + 'MB';
}

async function loadAssetsFileList() {
  const list = document.getElementById('assetsFileList');
  list.innerHTML = '<div class="assets-empty">불러오는 중...</div>';
  const res = await fetch('/api/projects/' + projectName + '/assets');
  if (!res.ok) { list.innerHTML = '<div class="assets-empty">목록을 불러오지 못했습니다.</div>'; return; }
  const assets = await res.json();
  if (!assets.length) { list.innerHTML = '<div class="assets-empty">업로드된 파일이 없습니다.</div>'; return; }
  list.innerHTML = '';
  assets.forEach((a) => {
    const row = document.createElement('div');
    row.className = 'assets-file-row';
    row.innerHTML =
      '<span class="af-name" title="' + a.name + '">' + a.name + '</span>' +
      '<span class="af-size">' + formatBytes(a.size) + '</span>' +
      '<button data-act="insert">삽입</button>' +
      '<button data-act="copy">경로복사</button>' +
      '<button data-act="rename">이름변경</button>' +
      '<button data-act="delete">삭제</button>';
    row.querySelector('[data-act="insert"]').onclick = () => insertAssetTag(a.name);
    row.querySelector('[data-act="copy"]').onclick = () => {
      navigator.clipboard.writeText('assets/' + a.name);
      showToast('경로를 복사했습니다.');
    };
    row.querySelector('[data-act="rename"]').onclick = async () => {
      const next = prompt('새 파일명을 입력하세요.', a.name);
      if (!next || next === a.name) return;
      const r = await fetch('/api/projects/' + projectName + '/assets/rename', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({old_filename: a.name, new_filename: next}),
      });
      if (r.ok) { showToast('이름을 변경했습니다.'); loadAssetsFileList(); }
      else { const d = await r.json(); showToast('이름 변경 실패: ' + (d.detail || ''), true); }
    };
    row.querySelector('[data-act="delete"]').onclick = async () => {
      if (!confirm('"' + a.name + '" 파일을 삭제하시겠습니까?')) return;
      const r = await fetch('/api/projects/' + projectName + '/assets/' + encodeURIComponent(a.name), {method: 'DELETE'});
      if (r.ok) { showToast('삭제했습니다.'); loadAssetsFileList(); }
      else { showToast('삭제 실패', true); }
    };
    list.appendChild(row);
  });
}

function openAssetsModal() {
  document.getElementById('assetsModal').style.display = 'flex';
  switchAssetsTab('files');
}
function closeAssetsModal() {
  document.getElementById('assetsModal').style.display = 'none';
}
function switchAssetsTab(tab) {
  document.querySelectorAll('.modal-tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('assetsFilesTab').style.display = tab === 'files' ? 'block' : 'none';
  document.getElementById('assetsLogosTab').style.display = tab === 'logos' ? 'block' : 'none';
  document.getElementById('assetsPhotosTab').style.display = tab === 'photos' ? 'block' : 'none';
  if (tab === 'files') loadAssetsFileList();
  else if (tab === 'photos') checkUnsplashStatus();
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

async function importAssetFromUrl(url, filename, onDone) {
  const res = await fetch('/api/projects/' + projectName + '/assets/import-url', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({url, filename}),
  });
  if (res.ok) {
    const data = await res.json();
    insertAssetTag(data.filename);
    if (onDone) onDone();
  } else {
    const d = await res.json();
    showToast('가져오기 실패: ' + (d.detail || ''), true);
  }
}

const runLogoSearch = debounce(async (q) => {
  const results = document.getElementById('logoResults');
  if (!q.trim()) { results.innerHTML = ''; return; }
  results.innerHTML = '<div class="assets-empty">검색 중...</div>';
  const res = await fetch('/api/logos/search?q=' + encodeURIComponent(q));
  const items = res.ok ? await res.json() : [];
  if (!items.length) { results.innerHTML = '<div class="assets-empty">검색 결과가 없습니다.</div>'; return; }
  results.innerHTML = '';
  items.forEach((item) => {
    const cell = document.createElement('div');
    cell.className = 'assets-grid-item';
    cell.innerHTML = '<img src="' + item.url + '" alt="' + item.name + '"><span class="agi-label">' + item.name + '</span>';
    cell.onclick = () => {
      const ext = (item.url.split('.').pop() || 'svg').split('?')[0].slice(0, 5);
      importAssetFromUrl(item.url, item.name + '.' + ext);
    };
    results.appendChild(cell);
  });
}, 400);
document.getElementById('logoSearchInput').addEventListener('input', (e) => runLogoSearch(e.target.value));

async function checkUnsplashStatus() {
  const res = await fetch('/api/unsplash/status');
  const data = res.ok ? await res.json() : {configured: false};
  document.getElementById('unsplashSetup').style.display = data.configured ? 'none' : 'block';
  document.getElementById('unsplashSearchArea').style.display = data.configured ? 'block' : 'none';
}

async function saveUnsplashKey() {
  const key = document.getElementById('unsplashKeyInput').value.trim();
  if (!key) return;
  const res = await fetch('/api/unsplash/key', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({api_key: key}),
  });
  if (res.ok) { showToast('Unsplash 키를 등록했습니다.'); checkUnsplashStatus(); }
  else { const d = await res.json(); showToast('등록 실패: ' + (d.detail || ''), true); }
}

async function clearUnsplashKey() {
  if (!confirm('등록된 Unsplash API 키를 삭제하시겠습니까?')) return;
  await fetch('/api/unsplash/key', {method: 'DELETE'});
  showToast('키를 삭제했습니다.');
  checkUnsplashStatus();
}

const runPhotoSearch = debounce(async (q) => {
  const results = document.getElementById('photoResults');
  if (!q.trim()) { results.innerHTML = ''; return; }
  results.innerHTML = '<div class="assets-empty">검색 중...</div>';
  const res = await fetch('/api/unsplash/search?q=' + encodeURIComponent(q));
  if (!res.ok) { const d = await res.json(); results.innerHTML = '<div class="assets-empty">' + (d.detail || '검색 실패') + '</div>'; return; }
  const data = await res.json();
  if (!data.results.length) { results.innerHTML = '<div class="assets-empty">검색 결과가 없습니다.</div>'; return; }
  results.innerHTML = '';
  data.results.forEach((photo) => {
    const cell = document.createElement('div');
    cell.className = 'assets-grid-item';
    cell.innerHTML = '<img src="' + photo.thumb + '" alt="' + photo.author + '"><span class="agi-label">' + photo.author + '</span>';
    cell.onclick = () => {
      importAssetFromUrl(photo.regular, 'unsplash-' + photo.id + '.jpg', () => {
        fetch('/api/unsplash/track-download', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({download_location: photo.download_location}),
        });
      });
    };
    results.appendChild(cell);
  });
}, 500);
document.getElementById('photoSearchInput').addEventListener('input', (e) => runPhotoSearch(e.target.value));

async function saveSlideHtml() {
  if (!currentSlide) return;
  const html = htmlCM.getValue();
  const res = await fetch('/api/projects/' + projectName + '/slides/' + currentSlide, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({html})
  });
  if (res.ok) {
    originalHtml = html;
    setDirty(false);
    invalidateThumb(currentSlide);
    showToast('저장 완료');
  } else {
    showToast('저장 실패', true);
  }
}

async function loadContent() {
  const res = await fetch('/api/projects/' + projectName + '/content');
  if (res.ok) {
    const data = await res.json();
    document.getElementById('contentEditor').value = data.content;
  }
}

async function saveContent() {
  const content = document.getElementById('contentEditor').value;
  const res = await fetch('/api/projects/' + projectName + '/content', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({content})
  });
  if (res.ok) showToast('Content.md 저장 완료');
}

function switchTab(tab) {
  if (tab !== 'slide' && blockIfAiEditBusy()) return;
  if (tab !== 'slide' && !confirmDiscardIfDirty()) return;
  if (tab !== 'slide') {
    setDirty(false);
    htmlCM.setValue(originalHtml);
  }
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('slideTab').style.display = tab === 'slide' ? 'flex' : 'none';
  document.getElementById('contentTab').style.display = tab === 'content' ? 'flex' : 'none';
  if (tab === 'content') loadContent();
  if (tab === 'slide') requestAnimationFrame(fitPreviewFrame);
}

async function buildPptx() {
  const btn = document.getElementById('buildBtn');
  btn.disabled = true;
  btn.textContent = '빌드 중...';
  updateStatusBadge('building');

  try {
    const res = await fetch('/api/projects/' + projectName + '/build', {method:'POST'});
    const data = await res.json();
    if (res.ok) {
      showToast('PPTX 빌드 완료!');
      document.getElementById('downloadBtn').disabled = false;
      updateStatusBadge('completed');
    } else {
      showToast('빌드 실패: ' + (data.detail || ''), true);
      updateStatusBadge('failed');
    }
    await loadProject();
  } catch(e) {
    showToast('빌드 오류: ' + e.message, true);
    updateStatusBadge('failed');
  }
  btn.disabled = false;
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M4 4h16v16H4z"/><path d="M9 9h6v6H9z"/></svg> PPTX 빌드';
}

function downloadPptx() {
  window.open('/api/projects/' + projectName + '/download', '_blank');
}

function exportHtml() {
  window.open('/api/projects/' + projectName + '/export/html', '_blank');
}

async function exportPdf() {
  const btn = document.getElementById('exportPdfBtn');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.textContent = 'PDF 생성 중...';
  try {
    const res = await fetch('/api/projects/' + projectName + '/export/pdf', {method:'POST'});
    const data = await res.json();
    if (res.ok) {
      showToast('PDF 생성 완료!');
      window.open('/api/projects/' + projectName + '/export/pdf/download', '_blank');
    } else {
      showToast('PDF 생성 실패: ' + (data.detail || ''), true);
    }
  } catch(e) {
    showToast('PDF 생성 오류: ' + e.message, true);
  }
  btn.disabled = false;
  btn.innerHTML = original;
}

async function deleteProject() {
  if (!confirm('정말로 이 프로젝트를 삭제하시겠습니까?')) return;
  const res = await fetch('/api/projects/' + projectName, {method:'DELETE'});
  if (res.ok) window.location.href = '/';
  else showToast('삭제 실패', true);
}

function showToast(msg, isError) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:6px;font-size:13px;z-index:9999;color:#fff;background:' + (isError ? '#ee0000' : '#2e7d32');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function fitPreviewFrame() {
  if (!currentSlide) return;
  const container = document.getElementById('previewContainer');
  const frame = document.getElementById('previewFrame');
  const pad = 16;
  const cw = container.clientWidth - pad;
  const ch = container.clientHeight - pad;
  const scale = Math.max(Math.min(cw / 960, ch / 540), 0.1);
  frame.style.transform = 'scale(' + scale + ')';
}

window.addEventListener('resize', fitPreviewFrame);

// A click anywhere in this (outer) document only fires here at all when it
// lands outside the preview iframe — clicks inside it are handled entirely
// by the iframe's own document and never bubble across that boundary. So
// any such click means "the user clicked away from the slide" — close
// whatever WYSIWYG toolbar/popup might still be open in there.
document.addEventListener('click', () => {
  const frame = document.getElementById('previewFrame');
  if (frame && frame.contentWindow && frame.contentWindow.__wysiwygClearSelection) {
    frame.contentWindow.__wysiwygClearSelection();
  }
});

document.getElementById('homeLink').addEventListener('click', (e) => { if (blockIfAiEditBusy() || !confirmDiscardIfDirty()) e.preventDefault(); });
document.getElementById('dashboardLink').addEventListener('click', (e) => { if (blockIfAiEditBusy() || !confirmDiscardIfDirty()) e.preventDefault(); });

loadNavUser();
loadProject();
</script>
