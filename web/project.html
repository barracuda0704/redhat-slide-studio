<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 - Slide Studio</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/xml-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchtags.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<style>
html, body { height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; }
.masthead { flex-shrink: 0; }
main.content { flex: 1; min-height: 0; display: flex; }

.project-layout { flex: 1; min-height: 0; width: 100%; display: grid; grid-template-columns: 240px 1fr; gap: 0; background: var(--surface-card); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.slide-sidebar { height: 100%; background: var(--surface); border-right: 1px solid var(--border); padding: 16px 0; overflow-y: auto; }
.slide-sidebar.nav-locked { opacity: .55; pointer-events: none; }
.slide-list-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer;
  color: var(--text-muted); font-size: 13px; transition: background 0.15s;
  border-left: 3px solid transparent;
}
.slide-list-item:hover { background: var(--surface-card); }
.slide-list-item.active { background: var(--rh-red-tint); border-left-color: var(--rh-red); color: var(--text); }
.slide-num { font-weight: 700; color: var(--rh-red); min-width: 24px; text-align: center; font-size: 12px; }
.slide-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.slide-actions { display: flex; gap: 2px; flex-shrink: 0; opacity: 0; transition: opacity .15s; }
.slide-list-item:hover .slide-actions, .slide-list-item.active .slide-actions { opacity: 1; }
.slide-action-btn {
  width: 18px; height: 18px; border: none; background: transparent; color: var(--text-muted);
  font-size: 12px; cursor: pointer; border-radius: 3px; display: flex; align-items: center;
  justify-content: center; padding: 0; line-height: 1; flex-shrink: 0;
}
.slide-action-btn:hover { background: rgba(0,0,0,.08); color: var(--text); }
.slide-action-btn:disabled { opacity: .3; cursor: default; }
.slide-action-btn:disabled:hover { background: transparent; color: var(--text-muted); }
.slide-action-btn.slide-action-danger:hover { background: var(--danger-bg); color: var(--danger); }
.sidebar-add-slide { padding: 8px 16px 4px; }
.sidebar-add-slide button { width: 100%; justify-content: center; font-size: 12px; padding: 6px 10px; }

.slide-main { height: 100%; min-height: 0; overflow: hidden; box-sizing: border-box; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; background: var(--surface-card); }
.toolbar {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px; flex-wrap: wrap;
}
.toolbar.nav-locked, .html-toolbar.nav-locked { opacity: .55; pointer-events: none; }
.toolbar .btn { font-size: 13px; padding: 7px 14px; }
.toolbar .status-badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase;
  border: 1px solid transparent;
}
.status-draft { background: #F6F6F6; color: var(--text-muted); border-color: var(--border); }
.status-generating { background: var(--warning-bg); color: var(--warning); }
.status-completed { background: var(--success-bg); color: var(--success); }
.status-building { background: var(--rh-red-tint); color: var(--rh-red-dark); }
.status-failed { background: var(--danger-bg); color: var(--danger); }

.tab-bar { flex-shrink: 0; display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 0; }
.tab-bar.nav-locked { opacity: .55; pointer-events: none; }
.tab-btn {
  padding: 8px 18px; cursor: pointer; color: var(--text-muted); font-size: 13px;
  border-bottom: 2px solid transparent; transition: all 0.15s; background: none; border-top: none; border-left: none; border-right: none;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--rh-red); border-bottom-color: var(--rh-red); }

#slideTab { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.preview-container {
  flex: 1; min-height: 0; width: 100%; box-sizing: border-box; background: #fff;
  border: 1px solid var(--border-strong); border-radius: 4px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.preview-container iframe {
  width: 960px; height: 540px; border: none; background: #fff;
  transform-origin: center center;
  overflow: hidden;
}
.preview-empty { color: var(--text-muted); font-size: 14px; }

.html-accordion { flex-shrink: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--surface); }
.html-accordion-header {
  display: flex; align-items: center; gap: 8px; padding: 10px 16px; cursor: pointer;
  font-size: 13px; font-weight: 700; color: var(--text); user-select: none;
}
.html-accordion-header .chevron { transition: transform .15s; color: var(--text-muted); }
.html-accordion.open .html-accordion-header { border-bottom: 1px solid var(--border); }
.html-accordion.open .html-accordion-header .chevron { transform: rotate(90deg); }
.html-dirty-dot {
  display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--rh-red); flex-shrink: 0;
}
.html-dirty-dot.show { display: inline-block; }
.html-accordion-actions { margin-left: auto; display: flex; gap: 8px; }
.html-accordion-body { display: none; flex-direction: column; gap: 8px; height: 360px; padding: 0 16px 12px; box-sizing: border-box; }
.html-accordion.open .html-accordion-body { display: flex; }
.html-accordion-body .CodeMirror {
  flex: 1; min-height: 0; height: 100%; width: 100%;
  border: 1px solid var(--border-strong); border-radius: 4px;
  font-family: 'Red Hat Mono', monospace; font-size: 12px; line-height: 1.5;
}
.html-accordion-body .CodeMirror-activeline-background { background: var(--rh-red-tint); }

.resize-handle {
  flex-shrink: 0; height: 12px; margin: 0 -16px; cursor: row-resize;
  display: flex; align-items: center; justify-content: center; position: relative;
}
.resize-handle::after {
  content: ''; width: 36px; height: 4px; border-radius: 2px; background: var(--border-strong);
  transition: background .15s;
}
.resize-handle:hover::after { background: var(--rh-red); }

.html-toolbar { flex-shrink: 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.html-toolbar .btn {
  height: 30px; box-sizing: border-box; font-size: 12px; padding: 0 10px;
  display: inline-flex; align-items: center; gap: 6px; line-height: 1;
}
.html-toolbar .btn svg { width: 14px; height: 14px; flex-shrink: 0; }

.ai-edit-bar {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
}
.ai-edit-bar svg { color: var(--rh-red); flex-shrink: 0; }
.ai-edit-bar input[type="text"] {
  flex: 1; box-sizing: border-box; padding: 7px 10px; border: 1px solid var(--border-strong);
  border-radius: 4px; font-size: 12.5px; font-family: inherit; margin: 0;
}
.ai-edit-bar .btn { font-size: 12.5px; padding: 7px 14px; flex-shrink: 0; }

.content-editor { flex: 1; min-height: 0; display: none; flex-direction: column; }
.content-editor textarea {
  flex: 1; min-height: 0; width: 100%; box-sizing: border-box; padding: 16px;
  background: #fff; color: var(--text); border: 1px solid var(--border-strong);
  border-radius: 4px; font-family: 'Red Hat Mono', monospace; font-size: 13px; line-height: 1.6; resize: none;
}
.section-header { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.section-header h3 { margin: 0; font-size: 14px; color: var(--text); }
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-brand">
    <a href="/" class="masthead-home-link" id="homeLink">
      <span class="rh-mark"></span>
      <span class="masthead-title">Slide Studio</span>
    </a>
    <span class="masthead-context" id="projectTitle">프로젝트</span>
  </div>
  <nav class="masthead-nav">
    <a href="/" class="masthead-nav-link" id="dashboardLink">대시보드</a>
  </nav>
  <div class="nav-user" id="navUser"></div>
</div>

<main class="content" style="padding:0; max-width:none;">
  <div class="project-layout">
    <!-- Sidebar: slide list -->
    <div class="slide-sidebar">
      <div style="padding:0 16px 12px; border-bottom:1px solid var(--border); margin-bottom:8px;">
        <h3 style="margin:0 0 4px; font-size:13px; color:var(--text);">슬라이드</h3>
        <div style="font-size:11px; color:var(--text-muted);" id="slideCount">0장</div>
      </div>
      <div id="slideList"></div>
      <div class="sidebar-add-slide">
        <button class="btn btn-sm" onclick="addBlankSlide()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          새 슬라이드
        </button>
      </div>
    </div>

    <!-- Main area -->
    <div class="slide-main">
      <div class="toolbar">
        <span class="status-badge" id="statusBadge">DRAFT</span>
        <div style="flex:1"></div>
        <button class="btn" id="buildBtn" onclick="buildPptx()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M4 4h16v16H4z"/><path d="M9 9h6v6H9z"/></svg>
          PPTX 빌드
        </button>
        <button class="btn" id="downloadBtn" onclick="downloadPptx()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          다운로드
        </button>
        <button class="btn" id="exportHtmlBtn" onclick="exportHtml()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M16 18l6-6-6-6"/><path d="M8 6l-6 6 6 6"/></svg>
          HTML 내보내기
        </button>
        <button class="btn" id="exportPdfBtn" onclick="exportPdf()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          PDF 내보내기
        </button>
        <button class="btn btn-danger" onclick="deleteProject()">삭제</button>
      </div>

      <div class="warning-box" id="buildWarning" style="display:none; margin:0;"></div>

      <!-- Tabs -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="slide" onclick="switchTab('slide')">슬라이드</button>
        <button class="tab-btn" data-tab="content" onclick="switchTab('content')">Content.md</button>
      </div>

      <!-- Slide: preview + collapsible HTML editor -->
      <div id="slideTab">
        <div class="preview-container" id="previewContainer">
          <div class="preview-empty" id="previewEmpty">슬라이드를 선택하세요.</div>
          <iframe id="previewFrame" style="display:none"></iframe>
        </div>

        <div class="ai-edit-bar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4L12 3z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z"/></svg>
          <input type="text" id="aiEditInput" placeholder="AI에게 이 슬라이드 수정 요청 (예: 제목을 더 크게 해줘)">
          <button class="btn btn-primary" id="aiEditBtn" onclick="applyAiEdit()">AI 수정</button>
        </div>

        <div class="html-accordion" id="htmlAccordion">
          <div class="html-accordion-header" onclick="toggleHtmlEditor()">
            <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            <span id="htmlEditorTitle">HTML 편집</span>
            <span class="html-dirty-dot" id="htmlDirtyDot" title="저장되지 않은 변경사항"></span>
            <div class="html-accordion-actions" onclick="event.stopPropagation()">
              <button class="btn btn-primary" id="saveSlideBtn" onclick="saveSlideHtml()" style="font-size:12px; padding:5px 12px;" disabled>저장</button>
            </div>
          </div>
          <div class="html-accordion-body">
            <div class="resize-handle" id="resizeHandle" title="드래그해서 높이 조절"></div>
            <div class="html-toolbar">
              <button class="btn" id="undoBtn" onclick="restoreSlideBackup()" disabled title="마지막 저장 이전 버전으로 되돌리기">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3.5-7.1"/><path d="M3 4v5h5"/></svg>
                되돌리기
              </button>
              <button type="button" class="btn" onclick="document.getElementById('assetUploadInput').click()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
                이미지 업로드
              </button>
              <input type="file" id="assetUploadInput" accept="image/*" style="display:none">
              <button class="btn" id="imageGenBtn" onclick="showImageGenStub()" title="이미지 생성 (준비 중)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                이미지 생성
              </button>
            </div>
            <textarea id="htmlEditor" spellcheck="false"></textarea>
          </div>
        </div>
      </div>

      <!-- Content Editor -->
      <div class="content-editor" id="contentTab">
        <div class="section-header">
          <h3>Content.md</h3>
          <button class="btn btn-primary" onclick="saveContent()" style="font-size:12px; padding:5px 12px;">저장</button>
        </div>
        <textarea id="contentEditor" spellcheck="false"></textarea>
      </div>
    </div>
  </div>
</main>

<script>
const ICON_SHIELD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg>';
const ICON_LOGOUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h4"/><path d="M15 16l4-4-4-4"/><path d="M19 12H9"/></svg>';
function navUserHTML(me) {
  return '<span class="avatar">' + me.email.charAt(0).toUpperCase() + '</span>' +
    '<span class="email">' + me.email + '</span>' +
    (me.role === 'admin' ? '<a href="/admin" title="관리자 페이지">' + ICON_SHIELD + '관리자</a>' : '') +
    '<a href="#" onclick="logout(); return false;" title="로그아웃">' + ICON_LOGOUT + '로그아웃</a>';
}
async function loadNavUser() {
  try {
    const res = await fetch('/api/me');
    if (!res.ok) { window.location.href = '/login'; return; }
    const me = await res.json();
    if (me.login_disabled) return;
    document.getElementById('navUser').innerHTML = navUserHTML(me);
  } catch(e) { window.location.href = '/login'; }
}
async function logout() { await fetch('/api/logout', {method:'POST'}); window.location.href = '/login'; }

const projectName = window.location.pathname.split('/projects/')[1]?.replace(/\/$/, '');
let currentSlide = null;
let project = null;
let previewResizeObserver = null;
let originalHtml = '';
let htmlDirty = false;
let liveUpdateTimer = null;
let aiEditInProgress = false;

const htmlCM = CodeMirror.fromTextArea(document.getElementById('htmlEditor'), {
  mode: 'htmlmixed',
  lineNumbers: true,
  lineWrapping: true,
  matchBrackets: true,
  matchTags: {bothTags: true},
  autoCloseBrackets: true,
  autoCloseTags: true,
  styleActiveLine: true,
  indentUnit: 2,
  tabSize: 2,
});
htmlCM.on('change', onHtmlInput);

function confirmDiscardIfDirty() {
  if (!htmlDirty) return true;
  return confirm('저장하지 않은 변경사항이 있습니다. 계속하면 변경사항이 사라집니다. 계속하시겠습니까?');
}

// AI edit runs async and its result is applied to whatever slide is loaded
// in the editor when the response arrives — if the user switched slides
// while it was in flight, the result would land on the wrong slide. Block
// navigation entirely while a request is outstanding instead.
function blockIfAiEditBusy() {
  if (aiEditInProgress) {
    showToast('AI 수정 처리 중입니다. 완료 후 다시 시도하세요.', true);
    return true;
  }
  return false;
}

function setDirty(v) {
  htmlDirty = v;
  document.getElementById('htmlDirtyDot').classList.toggle('show', v);
  document.getElementById('saveSlideBtn').disabled = !v;
}

window.addEventListener('beforeunload', (e) => {
  if (htmlDirty) { e.preventDefault(); e.returnValue = ''; }
});

function updateStatusBadge(status) {
  const badge = document.getElementById('statusBadge');
  const labels = {draft:'DRAFT', generating:'생성 중...', completed:'완료', building:'빌드 중...', failed:'실패'};
  badge.textContent = labels[status] || status;
  badge.className = 'status-badge status-' + status;
}

async function loadProject(autoSelect = true) {
  const res = await fetch('/api/projects/' + projectName);
  if (!res.ok) { window.location.href = '/'; return; }
  project = await res.json();
  document.getElementById('projectTitle').textContent = project.title;
  document.title = project.title + ' - Slide Studio';
  updateStatusBadge(project.status);

  const hasSlides = !!(project.slides && project.slides.length > 0);
  document.getElementById('buildBtn').disabled = !hasSlides;
  document.getElementById('downloadBtn').disabled = !project.has_pptx;
  document.getElementById('exportHtmlBtn').disabled = !hasSlides;
  document.getElementById('exportPdfBtn').disabled = !hasSlides;

  const warningEl = document.getElementById('buildWarning');
  const warningText = project.build_warning || project.generation_warning;
  if (warningText) {
    warningEl.textContent = warningText;
    warningEl.style.display = 'block';
  } else {
    warningEl.style.display = 'none';
  }

  const slides = project.slides || [];
  document.getElementById('slideCount').textContent = slides.length + '장';
  const list = document.getElementById('slideList');
  list.innerHTML = '';
  slides.forEach((s, i) => {
    const item = document.createElement('div');
    item.className = 'slide-list-item' + (currentSlide === s ? ' active' : '');
    item.innerHTML =
      '<span class="slide-num">' + (i+1) + '</span>' +
      '<span class="slide-name">' + s.replace('.html','') + '</span>' +
      '<span class="slide-actions">' +
        '<button class="slide-action-btn" title="위로"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
        '<button class="slide-action-btn" title="아래로"' + (i === slides.length - 1 ? ' disabled' : '') + '>↓</button>' +
        '<button class="slide-action-btn slide-action-danger" title="삭제">×</button>' +
      '</span>';
    item.onclick = () => selectSlide(s);
    const [upBtn, downBtn, delBtn] = item.querySelectorAll('.slide-action-btn');
    upBtn.onclick = (e) => moveSlide(i, -1, e);
    downBtn.onclick = (e) => moveSlide(i, 1, e);
    delBtn.onclick = (e) => deleteSlide(s, e);
    list.appendChild(item);
  });

  if (autoSelect && slides.length > 0 && !currentSlide) selectSlide(slides[0]);

  if (project.status === 'generating') {
    setTimeout(loadProject, 3000);
  }
}

function toggleHtmlEditor() {
  const open = document.getElementById('htmlAccordion').classList.toggle('open');
  if (open) requestAnimationFrame(() => htmlCM.refresh());
  requestAnimationFrame(fitPreviewFrame);
}

// Drag the handle at the top of the HTML editor to resize it against the
// preview above — independent of the accordion's own collapse/expand toggle.
(function setupResizeHandle() {
  const handle = document.getElementById('resizeHandle');
  const body = document.querySelector('.html-accordion-body');
  let dragging = false;
  let startY = 0;
  let startHeight = 0;

  handle.addEventListener('mousedown', (e) => {
    dragging = true;
    startY = e.clientY;
    startHeight = body.getBoundingClientRect().height;
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const delta = startY - e.clientY; // drag up = grow the editor
    const slideTab = document.getElementById('slideTab');
    const maxHeight = slideTab.clientHeight - 160; // keep some room for the preview
    const newHeight = Math.min(Math.max(startHeight + delta, 140), Math.max(maxHeight, 140));
    body.style.height = newHeight + 'px';
    htmlCM.setSize(null, '100%');
    fitPreviewFrame();
  });

  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    document.body.style.userSelect = '';
    htmlCM.refresh();
  });
})();

// WYSIWYG overlay injected into the preview iframe's own document. The
// iframe is same-origin (srcdoc inherits the parent's origin), so this
// script can call window.parent.* directly — no postMessage plumbing
// needed. Click an element -> floating toolbar: font-size +/-/reset for
// text, drag-to-reposition for images, and "AI 수정" (scoped to that one
// element) on both, reusing the existing ai-edit endpoint/lock.
const WYSIWYG_OVERLAY_SCRIPT = `
<style data-wysiwyg-overlay>
  [data-wysiwyg-hover] { outline: 2px dashed #ee0000 !important; outline-offset: 1px; cursor: pointer; }
  [data-wysiwyg-selected] { outline: 2px solid #ee0000 !important; outline-offset: 1px; }
  #__wysiwyg_toolbar {
    position: fixed; z-index: 999999; background: #151515; border-radius: 6px; padding: 5px 6px;
    display: flex; gap: 5px; align-items: center; box-shadow: 0 4px 16px rgba(0,0,0,.4);
    font-family: -apple-system, "Segoe UI", sans-serif; font-size: 11px; white-space: nowrap;
  }
  #__wysiwyg_toolbar button {
    background: #2b2b2b; color: #fff; border: none; border-radius: 4px; padding: 4px 8px;
    cursor: pointer; font-size: 11px; line-height: 1; font-family: inherit;
  }
  #__wysiwyg_toolbar button:hover { background: #ee0000; }
  #__wysiwyg_toolbar .wt-label { color: #9aa0a6; padding: 0 2px; }
  #__wysiwyg_toolbar .wt-color-swatch {
    width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 2px solid #444; cursor: pointer;
  }
  #__wysiwyg_toolbar .wt-color-swatch:hover { border-color: #fff; background: inherit !important; }
  #__wysiwyg_toolbar input[type="text"] {
    background: #2b2b2b; color: #fff; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font-size: 11px; font-family: inherit; width: 190px; outline: none;
  }
  #__wysiwyg_toolbar input[type="text"]:focus { border-color: #ee0000; }
  #__wysiwyg_color_popup {
    position: fixed; z-index: 999999; background: #151515; border-radius: 8px; padding: 8px;
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.45);
  }
  #__wysiwyg_color_popup .swatch {
    width: 22px; height: 22px; border-radius: 5px; border: 2px solid transparent; cursor: pointer; padding: 0;
  }
  #__wysiwyg_color_popup .swatch:hover { border-color: #fff; }
  #__wysiwyg_color_popup input[type="color"] {
    width: 22px; height: 22px; padding: 0; border: none; border-radius: 5px; cursor: pointer; background: none;
  }
</style>
<script data-wysiwyg-overlay>
(function () {
  var selected = null;
  var toolbar = null;

  function isEditable(el) { return el && /^(P|H1|H2|H3|H4|H5|H6|LI|IMG)$/.test(el.tagName); }
  function closestEditable(el) {
    while (el && el !== document.body) { if (isEditable(el)) return el; el = el.parentElement; }
    return null;
  }
  function removeToolbar() { if (toolbar) { toolbar.remove(); toolbar = null; } }
  function removeColorPopup() {
    var p = document.getElementById('__wysiwyg_color_popup');
    if (p) p.remove();
  }
  function clearSelection() {
    if (selected) selected.removeAttribute('data-wysiwyg-selected');
    selected = null;
    removeToolbar();
    removeColorPopup();
  }

  function rgbToHex(rgb) {
    var m = rgb && rgb.match(/\\d+/g);
    if (!m) return '#000000';
    return '#' + m.slice(0, 3).map(function (x) {
      var h = parseInt(x, 10).toString(16);
      return h.length === 1 ? '0' + h : h;
    }).join('');
  }

  function syncBack() {
    var clone = document.documentElement.cloneNode(true);
    clone.querySelectorAll('[data-wysiwyg-overlay]').forEach(function (n) { n.remove(); });
    clone.querySelectorAll('[data-wysiwyg-hover],[data-wysiwyg-selected]').forEach(function (n) {
      n.removeAttribute('data-wysiwyg-hover');
      n.removeAttribute('data-wysiwyg-selected');
    });
    window.parent.__wysiwygSync('<' + '!DOCTYPE html>\\n' + clone.outerHTML);
  }

  function showToolbar(el) {
    removeToolbar();
    removeColorPopup();
    var rect = el.getBoundingClientRect();
    toolbar = document.createElement('div');
    toolbar.id = '__wysiwyg_toolbar';
    toolbar.setAttribute('data-wysiwyg-overlay', '');
    toolbar.style.left = Math.max(4, rect.left) + 'px';
    toolbar.style.top = Math.max(4, rect.top - 36) + 'px';
    if (el.tagName === 'IMG') {
      toolbar.innerHTML = '<span class="wt-label">드래그로 이동</span><button data-act="ai">AI 수정</button>';
    } else {
      var curColor = rgbToHex(getComputedStyle(el).color);
      toolbar.innerHTML =
        '<button data-act="dec" title="글자 작게">A-</button>' +
        '<button data-act="inc" title="글자 크게">A+</button>' +
        '<button data-act="reset" title="기본 크기로">↺</button>' +
        '<button data-act="color-toggle" class="wt-color-swatch" style="background:' + curColor + '" title="글자색"></button>' +
        '<button data-act="ai">AI 수정</button>';
    }
    document.body.appendChild(toolbar);
    toolbar.addEventListener('mousedown', function (e) { e.stopPropagation(); });
    toolbar.addEventListener('click', function (e) {
      // Without this, a click on any toolbar button also bubbles up to the
      // document-level click listener below, which sees "clicked somewhere
      // that isn't inside an editable element" and calls clearSelection() —
      // wiping out the toolbar this same click just built/updated. That was
      // the "toolbar disappears after one click" bug.
      e.stopPropagation();
      var act = e.target.getAttribute('data-act');
      if (!act) return;
      if (act === 'inc' || act === 'dec') {
        var cur = parseFloat(getComputedStyle(el).fontSize) || 16;
        el.style.fontSize = Math.max(6, cur + (act === 'inc' ? 2 : -2)) + 'px';
        showToolbar(el); // re-show in place, no reload — repeated clicks now keep working
        syncBack();
      } else if (act === 'reset') {
        el.style.removeProperty('font-size');
        showToolbar(el);
        syncBack();
      } else if (act === 'color-toggle') {
        showColorPopup(el, toolbar);
      } else if (act === 'ai') {
        showAiInput(el);
      }
    });
  }

  function showColorPopup(el, anchorEl) {
    if (document.getElementById('__wysiwyg_color_popup')) { removeColorPopup(); return; }
    var anchorRect = anchorEl.getBoundingClientRect();
    var popup = document.createElement('div');
    popup.id = '__wysiwyg_color_popup';
    popup.setAttribute('data-wysiwyg-overlay', '');
    var colors = ['#ee0000', '#151515', '#4d4d4d', '#a3a3a3', '#ffffff',
                  '#0066cc', '#37a3a3', '#5e40be', '#f5921b', '#3e8635'];
    popup.innerHTML = colors.map(function (c) {
      return '<button class="swatch" data-color="' + c + '" style="background:' + c + '" title="' + c + '"></button>';
    }).join('') + '<input type="color" class="wt-custom-color" title="사용자 지정 색상">';
    document.body.appendChild(popup);

    // Anchor above the toolbar (not below it) so the popup never covers the
    // very toolbar buttons the user might still want to use.
    var popupRect = popup.getBoundingClientRect();
    popup.style.left = Math.max(4, anchorRect.left) + 'px';
    popup.style.top = Math.max(4, anchorRect.top - popupRect.height - 8) + 'px';

    popup.addEventListener('mousedown', function (e) { e.stopPropagation(); });
    popup.addEventListener('click', function (e) {
      e.stopPropagation();
      var c = e.target.getAttribute('data-color');
      if (c) {
        el.style.color = c;
        showToolbar(el);
        syncBack();
      }
    });
    popup.addEventListener('input', function (e) {
      if (e.target.classList.contains('wt-custom-color')) el.style.color = e.target.value;
    });
    popup.addEventListener('change', function (e) {
      if (e.target.classList.contains('wt-custom-color')) {
        showToolbar(el);
        syncBack();
      }
    });
  }

  function showAiInput(el) {
    removeToolbar();
    removeColorPopup();
    var rect = el.getBoundingClientRect();
    toolbar = document.createElement('div');
    toolbar.id = '__wysiwyg_toolbar';
    toolbar.setAttribute('data-wysiwyg-overlay', '');
    toolbar.style.left = Math.max(4, rect.left) + 'px';
    toolbar.style.top = Math.max(4, rect.top - 36) + 'px';
    toolbar.innerHTML =
      '<input type="text" placeholder="수정 요청 입력 후 Enter">' +
      '<button data-act="ai-submit">적용</button>' +
      '<button data-act="ai-cancel">✕</button>';
    document.body.appendChild(toolbar);
    var input = toolbar.querySelector('input');
    input.focus();
    function submit() {
      var instruction = input.value.trim();
      if (!instruction) return;
      window.parent.__wysiwygAiEdit(el.outerHTML, instruction);
    }
    toolbar.addEventListener('mousedown', function (e) { e.stopPropagation(); });
    // Same fix as showToolbar()'s click handler — without stopping
    // propagation here, clicking "적용"/"✕" bubbled to the document-level
    // click listener, which treated it as a click outside any editable
    // element and immediately tore the just-built input box down again
    // (the "AI 수정 입력창이 안 보인다" bug — it was there for a frame, then
    // instantly removed).
    toolbar.addEventListener('click', function (e) {
      e.stopPropagation();
      var act = e.target.getAttribute('data-act');
      if (act === 'ai-submit') submit();
      else if (act === 'ai-cancel') showToolbar(el);
    });
  }

  document.addEventListener('mouseover', function (e) {
    var el = closestEditable(e.target);
    document.querySelectorAll('[data-wysiwyg-hover]').forEach(function (n) { n.removeAttribute('data-wysiwyg-hover'); });
    if (el && el !== selected) el.setAttribute('data-wysiwyg-hover', '');
  });

  document.addEventListener('click', function (e) {
    var el = closestEditable(e.target);
    if (!el) { clearSelection(); return; }
    e.preventDefault();
    if (selected) selected.removeAttribute('data-wysiwyg-selected');
    selected = el;
    el.setAttribute('data-wysiwyg-selected', '');
    showToolbar(el);
  });

  var dragEl = null, dragOffsetX = 0, dragOffsetY = 0;
  document.addEventListener('mousedown', function (e) {
    if (e.target.tagName !== 'IMG') return;
    dragEl = e.target;
    var rect = dragEl.getBoundingClientRect();
    if (getComputedStyle(dragEl).position !== 'absolute') {
      dragEl.style.position = 'absolute';
      dragEl.style.left = rect.left + 'px';
      dragEl.style.top = rect.top + 'px';
      dragEl.style.margin = '0';
    }
    dragOffsetX = e.clientX - rect.left;
    dragOffsetY = e.clientY - rect.top;
  });
  document.addEventListener('mousemove', function (e) {
    if (!dragEl) return;
    dragEl.style.left = (e.clientX - dragOffsetX) + 'px';
    dragEl.style.top = (e.clientY - dragOffsetY) + 'px';
    if (toolbar && selected === dragEl) showToolbar(dragEl);
  });
  document.addEventListener('mouseup', function () {
    if (dragEl) { syncBack(); dragEl = null; }
  });
})();
<\/script>
`;

function buildPreviewHtml(rawHtml) {
  const rewritten = rawHtml
    .replaceAll('../../../../redhat/', '/engine/redhat/')
    .replaceAll('src="assets/', 'src="/api/projects/' + projectName + '/assets/');
  return rewritten.includes('</body>')
    ? rewritten.replace('</body>', WYSIWYG_OVERLAY_SCRIPT + '</body>')
    : rewritten + WYSIWYG_OVERLAY_SCRIPT;
}

function renderPreview(rawHtml) {
  const frame = document.getElementById('previewFrame');
  frame.setAttribute('scrolling', 'no');
  frame.srcdoc = buildPreviewHtml(rawHtml);
  requestAnimationFrame(fitPreviewFrame);
}

// Called by the overlay after any font-size/color/drag change. Reverses the
// two path rewrites buildPreviewHtml() applied so what lands back in
// CodeMirror matches the stored-source format exactly.
//
// The iframe's own live DOM already reflects the change (that's what the
// overlay just mutated) — re-rendering the preview from this synced source
// would reload the iframe from scratch and wipe the overlay's selection/
// toolbar state, which is exactly what made repeated clicks (e.g. A+ A+ A+)
// so annoying. suppressNextRerender skips just that one re-render; the
// source (and dirty flag) still update normally.
let suppressNextRerender = false;
window.__wysiwygSync = function (previewHtml) {
  const restored = previewHtml
    .replaceAll('src="/api/projects/' + projectName + '/assets/', 'src="assets/')
    .replaceAll('/engine/redhat/', '../../../../redhat/');
  suppressNextRerender = true;
  htmlCM.setValue(restored); // fires 'change' -> onHtmlInput()
};

function onHtmlInput() {
  const val = htmlCM.getValue();
  setDirty(val !== originalHtml);
  if (suppressNextRerender) {
    suppressNextRerender = false;
    return;
  }
  clearTimeout(liveUpdateTimer);
  liveUpdateTimer = setTimeout(() => renderPreview(val), 250);
}

async function selectSlide(filename) {
  if (filename === currentSlide) return;
  if (blockIfAiEditBusy()) return;
  if (!confirmDiscardIfDirty()) return;

  currentSlide = filename;
  setDirty(false);
  document.querySelectorAll('.slide-list-item').forEach((el, i) => {
    el.className = 'slide-list-item' + ((project.slides || [])[i] === filename ? ' active' : '');
  });

  document.getElementById('previewEmpty').style.display = 'none';
  document.getElementById('previewFrame').style.display = 'block';
  document.getElementById('htmlEditorTitle').textContent = 'HTML 편집 — ' + filename;

  if (!previewResizeObserver) {
    previewResizeObserver = new ResizeObserver(fitPreviewFrame);
    previewResizeObserver.observe(document.getElementById('previewContainer'));
  }

  const res = await fetch('/api/projects/' + projectName + '/slides/' + filename);
  if (res.ok) {
    const data = await res.json();
    originalHtml = data.html;
    htmlCM.setValue(data.html);
    htmlCM.clearHistory();
    renderPreview(data.html);
  }
  checkSlideBackup(filename);
}

async function checkSlideBackup(filename) {
  const undoBtn = document.getElementById('undoBtn');
  try {
    const res = await fetch('/api/projects/' + projectName + '/slides/' + filename + '/backup');
    const data = await res.json();
    undoBtn.disabled = !(res.ok && data.has_backup);
  } catch(e) {
    undoBtn.disabled = true;
  }
}

async function restoreSlideBackup() {
  if (!currentSlide) return;
  if (!confirm('마지막 저장 이전 버전으로 되돌립니다. 지금 편집 중인 내용은 사라집니다. 계속하시겠습니까?')) return;
  const res = await fetch('/api/projects/' + projectName + '/slides/' + currentSlide + '/restore', {method: 'POST'});
  if (res.ok) {
    const data = await res.json();
    originalHtml = data.html;
    htmlCM.setValue(data.html);
    setDirty(false);
    renderPreview(data.html);
    showToast('이전 버전으로 되돌렸습니다.');
  } else {
    showToast('되돌리기 실패', true);
  }
}

async function deleteSlide(filename, event) {
  if (event) event.stopPropagation();
  if (blockIfAiEditBusy()) return;
  if (!confirm('"' + filename.replace('.html','') + '" 슬라이드를 삭제하시겠습니까?')) return;
  const res = await fetch('/api/projects/' + projectName + '/slides/' + filename, {method: 'DELETE'});
  if (res.ok) {
    if (currentSlide === filename) currentSlide = null;
    showToast('슬라이드를 삭제했습니다.');
    await loadProject();
  } else {
    showToast('삭제 실패', true);
  }
}

async function addBlankSlide() {
  if (blockIfAiEditBusy()) return;
  if (!confirmDiscardIfDirty()) return;
  const res = await fetch('/api/projects/' + projectName + '/slides', {method: 'POST'});
  if (res.ok) {
    const data = await res.json();
    currentSlide = null;
    await loadProject(false); // don't auto-pick slide 1 — we're selecting the new slide next
    selectSlide(data.filename);
    showToast('새 슬라이드를 추가했습니다.');
  } else {
    showToast('추가 실패', true);
  }
}

async function moveSlide(index, direction, event) {
  if (event) event.stopPropagation();
  if (blockIfAiEditBusy()) return;
  const slides = (project.slides || []).slice();
  const toIndex = index + direction;
  if (toIndex < 0 || toIndex >= slides.length) return;
  const tmp = slides[index];
  slides[index] = slides[toIndex];
  slides[toIndex] = tmp;

  const res = await fetch('/api/projects/' + projectName + '/slides/reorder', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({order: slides}),
  });
  if (!res.ok) { showToast('순서 변경 실패', true); return; }
  const data = await res.json();
  // Always show whichever slide the user just moved (at its new position),
  // not whatever slide happened to be open before — clicking a ↑/↓ on a
  // slide that wasn't already open used to leave the old slide showing.
  const newCurrent = data.order[toIndex];
  currentSlide = null;
  await loadProject(false);
  selectSlide(newCurrent);
}

function showImageGenStub() {
  showToast('이미지 생성 기능은 준비 중입니다.');
}

async function runAiEdit(instruction, targetHtml) {
  if (!currentSlide || aiEditInProgress) return;
  const targetSlide = currentSlide; // the request is scoped to whatever slide is open right now
  aiEditInProgress = true;
  setNavigationLocked(true);
  const btn = document.getElementById('aiEditBtn');
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = '적용 중...';
  try {
    const res = await fetch('/api/projects/' + projectName + '/slides/' + targetSlide + '/ai-edit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({instruction, target_html: targetHtml || null}),
    });
    const data = await res.json();
    if (res.ok) {
      if (currentSlide === targetSlide) {
        // Navigation is locked while aiEditInProgress is true, so this should
        // always hold — checked anyway in case that ever changes.
        htmlCM.setValue(data.html); // fires 'change' -> onHtmlInput() marks dirty since it differs from originalHtml
        renderPreview(data.html);
        showToast('AI 수정 결과를 반영했습니다. 확인 후 저장하세요.');
      } else {
        showToast('"' + targetSlide.replace('.html','') + '" 슬라이드의 AI 수정 결과가 준비됐지만 화면이 전환되어 반영하지 않았습니다.', true);
      }
    } else {
      showToast('AI 수정 실패: ' + (data.detail || ''), true);
    }
  } catch(e) {
    showToast('AI 수정 오류: ' + e.message, true);
  }
  aiEditInProgress = false;
  setNavigationLocked(false);
  btn.disabled = false;
  btn.textContent = original;
}

async function applyAiEdit() {
  const input = document.getElementById('aiEditInput');
  const instruction = input.value.trim();
  if (!instruction) return;
  await runAiEdit(instruction, null);
  input.value = '';
}

// Called by the WYSIWYG overlay script running inside the preview iframe
// when the user clicks "AI 수정" on a selected element.
window.__wysiwygAiEdit = function(targetOuterHtml, instruction) {
  if (!instruction) return;
  runAiEdit(instruction, targetOuterHtml);
};

function setNavigationLocked(locked) {
  document.querySelector('.slide-sidebar').classList.toggle('nav-locked', locked);
  document.querySelector('.tab-bar').classList.toggle('nav-locked', locked);
  document.querySelector('.toolbar').classList.toggle('nav-locked', locked);
  document.querySelector('.html-toolbar').classList.toggle('nav-locked', locked);
}

document.getElementById('aiEditInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); applyAiEdit(); }
});

document.getElementById('assetUploadInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (!currentSlide) { showToast('먼저 슬라이드를 선택하세요.', true); e.target.value = ''; return; }
  const formData = new FormData();
  formData.append('file', file);
  const res = await fetch('/api/projects/' + projectName + '/assets', {method: 'POST', body: formData});
  if (res.ok) {
    const data = await res.json();
    htmlCM.replaceSelection('<img src="assets/' + data.filename + '" alt="">');
    showToast('업로드 완료 — 커서 위치에 <img> 태그를 삽입했습니다.');
  } else {
    showToast('업로드 실패', true);
  }
  e.target.value = '';
});

async function saveSlideHtml() {
  if (!currentSlide) return;
  const html = htmlCM.getValue();
  const res = await fetch('/api/projects/' + projectName + '/slides/' + currentSlide, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({html})
  });
  if (res.ok) {
    originalHtml = html;
    setDirty(false);
    showToast('저장 완료');
  } else {
    showToast('저장 실패', true);
  }
}

async function loadContent() {
  const res = await fetch('/api/projects/' + projectName + '/content');
  if (res.ok) {
    const data = await res.json();
    document.getElementById('contentEditor').value = data.content;
  }
}

async function saveContent() {
  const content = document.getElementById('contentEditor').value;
  const res = await fetch('/api/projects/' + projectName + '/content', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({content})
  });
  if (res.ok) showToast('Content.md 저장 완료');
}

function switchTab(tab) {
  if (tab !== 'slide' && blockIfAiEditBusy()) return;
  if (tab !== 'slide' && !confirmDiscardIfDirty()) return;
  if (tab !== 'slide') {
    setDirty(false);
    htmlCM.setValue(originalHtml);
  }
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('slideTab').style.display = tab === 'slide' ? 'flex' : 'none';
  document.getElementById('contentTab').style.display = tab === 'content' ? 'flex' : 'none';
  if (tab === 'content') loadContent();
  if (tab === 'slide') requestAnimationFrame(fitPreviewFrame);
}

async function buildPptx() {
  const btn = document.getElementById('buildBtn');
  btn.disabled = true;
  btn.textContent = '빌드 중...';
  updateStatusBadge('building');

  try {
    const res = await fetch('/api/projects/' + projectName + '/build', {method:'POST'});
    const data = await res.json();
    if (res.ok) {
      showToast('PPTX 빌드 완료!');
      document.getElementById('downloadBtn').disabled = false;
      updateStatusBadge('completed');
    } else {
      showToast('빌드 실패: ' + (data.detail || ''), true);
      updateStatusBadge('failed');
    }
    await loadProject();
  } catch(e) {
    showToast('빌드 오류: ' + e.message, true);
    updateStatusBadge('failed');
  }
  btn.disabled = false;
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M4 4h16v16H4z"/><path d="M9 9h6v6H9z"/></svg> PPTX 빌드';
}

function downloadPptx() {
  window.open('/api/projects/' + projectName + '/download', '_blank');
}

function exportHtml() {
  window.open('/api/projects/' + projectName + '/export/html', '_blank');
}

async function exportPdf() {
  const btn = document.getElementById('exportPdfBtn');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.textContent = 'PDF 생성 중...';
  try {
    const res = await fetch('/api/projects/' + projectName + '/export/pdf', {method:'POST'});
    const data = await res.json();
    if (res.ok) {
      showToast('PDF 생성 완료!');
      window.open('/api/projects/' + projectName + '/export/pdf/download', '_blank');
    } else {
      showToast('PDF 생성 실패: ' + (data.detail || ''), true);
    }
  } catch(e) {
    showToast('PDF 생성 오류: ' + e.message, true);
  }
  btn.disabled = false;
  btn.innerHTML = original;
}

async function deleteProject() {
  if (!confirm('정말로 이 프로젝트를 삭제하시겠습니까?')) return;
  const res = await fetch('/api/projects/' + projectName, {method:'DELETE'});
  if (res.ok) window.location.href = '/';
  else showToast('삭제 실패', true);
}

function showToast(msg, isError) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:6px;font-size:13px;z-index:9999;color:#fff;background:' + (isError ? '#ee0000' : '#2e7d32');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function fitPreviewFrame() {
  if (!currentSlide) return;
  const container = document.getElementById('previewContainer');
  const frame = document.getElementById('previewFrame');
  const pad = 16;
  const cw = container.clientWidth - pad;
  const ch = container.clientHeight - pad;
  const scale = Math.max(Math.min(cw / 960, ch / 540), 0.1);
  frame.style.transform = 'scale(' + scale + ')';
}

window.addEventListener('resize', fitPreviewFrame);

document.getElementById('homeLink').addEventListener('click', (e) => { if (blockIfAiEditBusy() || !confirmDiscardIfDirty()) e.preventDefault(); });
document.getElementById('dashboardLink').addEventListener('click', (e) => { if (blockIfAiEditBusy() || !confirmDiscardIfDirty()) e.preventDefault(); });

loadNavUser();
loadProject();
</script>
