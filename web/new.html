<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>새 슬라이드 - Slide Studio</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.form-group { margin-bottom: 18px; }
.form-group label { display: block; margin-bottom: 6px; color: var(--text); font-size: 13px; font-weight: 600; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; box-sizing: border-box; padding: 10px 12px;
  background: #fff; color: var(--text); border: 1px solid var(--border-strong);
  border-radius: 4px; font-size: 14px; font-family: inherit;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: var(--pf-blue); box-shadow: 0 0 0 1px var(--pf-blue);
}
.form-group textarea { resize: vertical; min-height: 100px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-hint { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
.progress-area { display: none; margin-top: 24px; padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; text-align: center; }
.progress-area .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--rh-red); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress-area .msg { color: var(--text-muted); font-size: 14px; }

.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
.theme-card {
  position: relative; border: 2px solid var(--border); border-radius: 8px; overflow: hidden;
  cursor: pointer; background: var(--surface-card); transition: border-color .15s, box-shadow .15s;
}
.theme-card:hover { border-color: var(--border-strong); }
.theme-card.selected { border-color: var(--rh-red); box-shadow: 0 0 0 1px var(--rh-red); }
.theme-card-slide {
  aspect-ratio: 16 / 9; display: flex; flex-direction: column; justify-content: center;
  padding: 12px 14px; gap: 4px;
}
.theme-card-eyebrow { width: 24px; height: 4px; border-radius: 2px; margin-bottom: 2px; }
.theme-card-title { font-size: 14px; font-weight: 800; line-height: 1.25; word-break: keep-all; }
.theme-card-sub { font-size: 8.5px; }
.theme-card-label {
  padding: 7px 10px; font-size: 12px; font-weight: 600; color: var(--text);
  background: var(--surface-card); border-top: 1px solid var(--border);
}
.theme-card-check {
  display: none; position: absolute; top: 8px; right: 8px; width: 20px; height: 20px;
  border-radius: 50%; background: var(--rh-red); color: #fff; align-items: center;
  justify-content: center; font-size: 12px; z-index: 2;
}
.theme-card.selected .theme-card-check { display: flex; }

.mode-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.mode-tab {
  padding: 8px 16px; cursor: pointer; color: var(--text-muted); font-size: 13px; font-weight: 600;
  border: none; background: none; border-bottom: 2px solid transparent; transition: all .15s; font-family: inherit;
}
.mode-tab:hover { color: var(--text); }
.mode-tab.active { color: var(--rh-red); border-bottom-color: var(--rh-red); }
#markdownContent { min-height: 240px; font-family: 'Red Hat Mono', monospace; font-size: 12.5px; line-height: 1.6; }
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-brand">
    <a href="/" class="masthead-home-link">
      <span class="rh-mark"></span>
      <span class="masthead-title">Slide Studio</span>
    </a>
    <span class="masthead-context">새 슬라이드</span>
  </div>
  <nav class="masthead-nav">
    <a href="/" class="masthead-nav-link">대시보드</a>
  </nav>
  <div class="nav-user" id="navUser"></div>
</div>

<div class="page-hero">
  <div class="page-eyebrow">Slide Studio</div>
  <h1>새 슬라이드 만들기</h1>
  <div class="page-subheading">주제를 입력하면 AI가 슬라이드를 자동으로 생성합니다.</div>
</div>

<main class="content">
  <div class="content-inner">
    <div class="card">
      <form id="createForm">
        <div class="form-group">
          <label for="title">슬라이드 제목</label>
          <input type="text" id="title" placeholder="예: Red Hat OpenShift AI 소개" required>
        </div>

        <div class="form-group">
          <label for="name">프로젝트 이름 (영문 slug)</label>
          <input type="text" id="name" placeholder="자동 생성됩니다" pattern="[a-z0-9-]+" title="영문 소문자, 숫자, 하이픈만 사용">
          <div class="form-hint">비워두면 제목에서 자동 생성됩니다.</div>
        </div>

        <div class="form-group">
          <label>생성 방식</label>
          <div class="mode-tabs">
            <button type="button" class="mode-tab active" data-mode="topic" onclick="setCreateMode('topic')">주제로 AI 생성</button>
            <button type="button" class="mode-tab" data-mode="markdown" onclick="setCreateMode('markdown')">마크다운 붙여넣기</button>
          </div>
        </div>

        <div id="topicFields">
          <div class="form-group">
            <label for="description">주제 설명</label>
            <textarea id="description" placeholder="슬라이드에서 다루고 싶은 내용을 자세히 설명해주세요..."></textarea>
          </div>

          <div class="form-group">
            <label for="numSlides">슬라이드 수</label>
            <input type="number" id="numSlides" min="1" max="30" step="1" value="8">
            <div class="form-hint">1~30 사이 숫자를 직접 입력하거나 위/아래 화살표로 조절하세요.</div>
          </div>
        </div>

        <div id="markdownFields" style="display:none">
          <div class="form-group">
            <label for="markdownContent">마크다운 콘텐츠</label>
            <textarea id="markdownContent" placeholder="## Slide 1: 타이틀&#10;- 내용&#10;&#10;## Slide 2: 제목&#10;- 핵심 메시지&#10;- 세부 내용"></textarea>
            <div class="form-hint">"## Slide N: 제목" 형식으로 붙여넣으면 콘텐츠 생성 단계 없이 이 내용을 그대로 슬라이드로 만듭니다.</div>
          </div>
        </div>

        <div class="form-group">
          <label>테마 선택</label>
          <div id="themeGrid" class="theme-grid"></div>
        </div>

        <div id="errorBox" class="error-box" style="display:none"></div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          <span id="submitText">슬라이드 생성</span>
        </button>
      </form>

      <div class="progress-area" id="progressArea">
        <div class="spinner"></div>
        <div class="msg" id="progressMsg">AI가 콘텐츠를 생성하고 있습니다...</div>
      </div>
    </div>
  </div>
</main>

<script>
const ICON_SHIELD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg>';
const ICON_LOGOUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h4"/><path d="M15 16l4-4-4-4"/><path d="M19 12H9"/></svg>';

function navUserHTML(me) {
  return '<span class="avatar">' + me.email.charAt(0).toUpperCase() + '</span>' +
    '<span class="email">' + me.email + '</span>' +
    (me.role === 'admin' ? '<a href="/admin" title="관리자 페이지">' + ICON_SHIELD + '관리자</a>' : '') +
    '<a href="#" onclick="logout(); return false;" title="로그아웃">' + ICON_LOGOUT + '로그아웃</a>';
}

async function loadNavUser() {
  try {
    const res = await fetch('/api/me');
    if (!res.ok) { window.location.href = '/login'; return; }
    const me = await res.json();
    if (me.login_disabled) return;
    document.getElementById('navUser').innerHTML = navUserHTML(me);
  } catch(e) { window.location.href = '/login'; }
}
async function logout() { await fetch('/api/logout', {method:'POST'}); window.location.href = '/login'; }

// Auto-generate slug from title
document.getElementById('title').addEventListener('input', function() {
  const nameField = document.getElementById('name');
  if (!nameField.dataset.manual) {
    nameField.value = this.value.toLowerCase()
      .replace(/[가-힣]+/g, m => '') // remove Korean
      .replace(/[^a-z0-9\s-]/g, '')
      .trim().replace(/\s+/g, '-').replace(/-+/g, '-')
      .substring(0, 40);
    if (!nameField.value && this.value) {
      nameField.value = 'project-' + Date.now().toString(36);
    }
  }
});
document.getElementById('name').addEventListener('input', function() { this.dataset.manual = '1'; });

// Load themes as visual sample-title-slide cards (colors pulled from each
// theme's actual palette / theme.css, not a generic swatch).
const THEME_PREVIEWS = {
  'academic-paper':     { bg: '#f7f5f0', text: '#1a1814', sub: '#4a4640', accent: '#6d4cff', font: '"Pretendard","Noto Sans KR",sans-serif' },
  'editorial-dark':     { bg: '#111111', text: '#f5f5f5', sub: '#b8b8b8', accent: '#8a4a4d', font: '"Pretendard","Noto Sans KR",sans-serif' },
  'modern-minimal':     { bg: '#ffffff', text: '#0a0a0a', sub: '#a3a3a3', accent: '#0066ff', font: '"Pretendard","Noto Sans KR",sans-serif' },
  'neon-terminal':      { bg: '#0a0e0f', text: '#00ff88', sub: '#5a7a5a', accent: '#00ff88', font: '"JetBrains Mono",monospace' },
  'paper-press':        { bg: '#f6f1e7', text: '#141210', sub: '#4d463c', accent: '#c43a1d', font: '"Pretendard","Noto Sans KR",serif' },
  'redhat-enterprise':  { bg: '#ffffff', text: '#151515', sub: '#4d4d4d', accent: '#ee0000', font: '"Noto Sans KR",sans-serif' },
  'redhat-modern-dark': { bg: '#151515', text: '#ffffff', sub: '#a3a3a3', accent: '#ee0000', font: '"Noto Sans KR",sans-serif' },
  'redhat-workshop':    { bg: '#f2f2f2', text: '#151515', sub: '#4d4d4d', accent: '#ee0000', font: '"JetBrains Mono","Noto Sans KR",monospace' },
};
const DEFAULT_PREVIEW = THEME_PREVIEWS['redhat-enterprise'];
let selectedTheme = 'redhat-enterprise';
let createMode = 'topic';

function setCreateMode(mode) {
  createMode = mode;
  document.querySelectorAll('.mode-tab').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('topicFields').style.display = mode === 'topic' ? 'block' : 'none';
  document.getElementById('markdownFields').style.display = mode === 'markdown' ? 'block' : 'none';
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadThemes() {
  const res = await fetch('/api/themes');
  if (!res.ok) return;
  const themes = await res.json();
  if (!themes.some(t => t.id === selectedTheme) && themes.length) selectedTheme = themes[0].id;

  const grid = document.getElementById('themeGrid');
  grid.innerHTML = themes.map(t => {
    const p = THEME_PREVIEWS[t.id] || DEFAULT_PREVIEW;
    const name = escapeHtml(t.name);
    return '<div class="theme-card' + (t.id === selectedTheme ? ' selected' : '') + '" data-theme="' + t.id + '">' +
      '<div class="theme-card-check">✓</div>' +
      '<div class="theme-card-slide" style="background:' + p.bg + '; font-family:' + p.font + '">' +
        '<div class="theme-card-eyebrow" style="background:' + p.accent + '"></div>' +
        '<div class="theme-card-title" style="color:' + p.text + '">' + name + '</div>' +
        '<div class="theme-card-sub" style="color:' + p.sub + '">샘플 타이틀 슬라이드</div>' +
      '</div>' +
      '<div class="theme-card-label">' + name + '</div>' +
    '</div>';
  }).join('');

  grid.querySelectorAll('.theme-card').forEach(card => {
    card.addEventListener('click', () => {
      selectedTheme = card.dataset.theme;
      grid.querySelectorAll('.theme-card').forEach(c => c.classList.toggle('selected', c === card));
    });
  });
}

// Poll project status
async function pollStatus(name) {
  const progress = document.getElementById('progressArea');
  const msg = document.getElementById('progressMsg');
  for (let i = 0; i < 120; i++) {
    await new Promise(r => setTimeout(r, 3000));
    try {
      const res = await fetch('/api/projects/' + name);
      if (!res.ok) continue;
      const p = await res.json();
      if (p.status === 'completed') {
        window.location.href = '/projects/' + name;
        return;
      }
      if (p.status === 'failed') {
        msg.textContent = '생성 실패: ' + (p.error || '알 수 없는 오류');
        msg.style.color = '#ee0000';
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('submitText').textContent = '다시 시도';
        return;
      }
      msg.textContent = 'AI가 슬라이드를 생성하고 있습니다... (' + (p.slides || 0) + '장 완료)';
    } catch(e) {}
  }
}

document.getElementById('createForm').addEventListener('submit', async e => {
  e.preventDefault();
  const errorBox = document.getElementById('errorBox');
  errorBox.style.display = 'none';

  let name = document.getElementById('name').value.trim();
  const title = document.getElementById('title').value.trim();
  const description = document.getElementById('description').value.trim();
  const numSlides = parseInt(document.getElementById('numSlides').value);
  const theme = selectedTheme;
  const markdownContent = document.getElementById('markdownContent').value.trim();

  if (!title) { errorBox.textContent = '제목을 입력하세요.'; errorBox.style.display = 'block'; return; }
  if (createMode === 'markdown' && !markdownContent) {
    errorBox.textContent = '마크다운 내용을 입력하세요.'; errorBox.style.display = 'block'; return;
  }
  if (!Number.isInteger(numSlides) || numSlides < 1 || numSlides > 30) {
    errorBox.textContent = '슬라이드 수는 1~30 사이 숫자로 입력하세요.'; errorBox.style.display = 'block'; return;
  }
  if (!name) name = 'project-' + Date.now().toString(36);

  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitText').textContent = '생성 중...';

  try {
    // Create project
    let res = await fetch('/api/projects', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, title, description, theme, num_slides: numSlides})
    });
    if (!res.ok) {
      const d = await res.json();
      throw new Error(d.detail || '프로젝트 생성 실패');
    }

    // Start generation
    res = await fetch('/api/projects/' + name + '/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        topic: title, description, num_slides: numSlides, theme,
        content_md: createMode === 'markdown' ? markdownContent : null,
      })
    });
    if (!res.ok) {
      const d = await res.json();
      throw new Error(d.detail || '생성 시작 실패');
    }

    document.getElementById('createForm').style.display = 'none';
    document.getElementById('progressArea').style.display = 'block';
    pollStatus(name);
  } catch(err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('submitText').textContent = '슬라이드 생성';
  }
});

loadNavUser();
loadThemes();
</script>
</body>
</html>
