<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide Studio</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.project-card {
  background: var(--surface-card); border: 1px solid var(--border); border-radius: 6px;
  padding: 20px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s;
}
.project-card:hover { border-color: var(--rh-red); box-shadow: 0 2px 12px rgba(238,0,0,0.1); }
.project-card h3 { margin: 0 0 6px; font-size: 15px; color: var(--text); }
.project-card .desc { color: var(--text-muted); font-size: 12px; margin: 0 0 12px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project-card .meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.project-card .meta-item { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
.project-card .badge {
  display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; text-transform: uppercase;
  border: 1px solid transparent;
}
.badge-draft { background: #F6F6F6; color: var(--text-muted); border-color: var(--border); }
.badge-generating { background: var(--warning-bg); color: var(--warning); }
.badge-completed { background: var(--success-bg); color: var(--success); }
.badge-building { background: var(--rh-red-tint); color: var(--rh-red-dark); }
.badge-failed { background: var(--danger-bg); color: var(--danger); }
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-brand">
    <a href="/" class="masthead-home-link">
      <span class="rh-mark"></span>
      <span class="masthead-title">Slide Studio</span>
    </a>
    <span class="masthead-context">Slide Studio</span>
  </div>
  <nav class="masthead-nav">
    <a href="/" class="masthead-nav-link active">대시보드</a>
  </nav>
  <div class="nav-user" id="navUser"></div>
</div>

<div class="page-hero">
  <div class="page-eyebrow">Slide Studio</div>
  <h1>슬라이드 대시보드</h1>
  <div class="page-subheading">슬라이드를 생성하고 관리하세요.</div>
</div>

<main class="content">
  <div class="content-inner">
    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px">
        <h2 style="margin:0">내 슬라이드</h2>
        <a href="/new" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          새 슬라이드 만들기
        </a>
      </div>

      <div id="projectGrid" class="project-grid"></div>
      <div class="empty" id="emptyState" style="display:none">
        <p style="color:var(--text-muted); font-size:14px; margin:32px 0;">아직 생성된 슬라이드가 없습니다.</p>
        <a href="/new" class="btn btn-primary" style="display:inline-flex">새 슬라이드 만들기</a>
      </div>
      <div id="loadingState" style="text-align:center; padding:32px; color:var(--text-muted); font-size:14px;">불러오는 중...</div>
    </div>
  </div>
</main>

<script>
const ICON_SHIELD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg>';
const ICON_LOGOUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h4"/><path d="M15 16l4-4-4-4"/><path d="M19 12H9"/></svg>';

function navUserHTML(me) {
  return '<span class="avatar">' + me.email.charAt(0).toUpperCase() + '</span>' +
    '<span class="email">' + me.email + '</span>' +
    (me.role === 'admin' ? '<a href="/admin" title="관리자 페이지">' + ICON_SHIELD + '관리자</a>' : '') +
    '<a href="#" onclick="logout(); return false;" title="로그아웃">' + ICON_LOGOUT + '로그아웃</a>';
}

async function loadNavUser() {
  try {
    const res = await fetch('/api/me');
    if (!res.ok) { window.location.href = '/login'; return; }
    const me = await res.json();
    if (me.login_disabled) return;
    document.getElementById('navUser').innerHTML = navUserHTML(me);
  } catch(e) { window.location.href = '/login'; }
}
async function logout() { await fetch('/api/logout', {method:'POST'}); window.location.href = '/login'; }

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('ko-KR', {year:'numeric', month:'short', day:'numeric'});
}

async function loadProjects() {
  const res = await fetch('/api/projects');
  document.getElementById('loadingState').style.display = 'none';
  if (!res.ok) return;
  const projects = await res.json();

  if (projects.length === 0) {
    document.getElementById('emptyState').style.display = 'block';
    return;
  }

  const grid = document.getElementById('projectGrid');
  grid.innerHTML = projects.map(p => {
    const statusLabels = {draft:'DRAFT', generating:'생성 중', completed:'완료', building:'빌드 중', failed:'실패'};
    return '<div class="project-card" onclick="window.location.href=\'/projects/' + p.name + '\'">' +
      '<h3>' + (p.title || p.name) + '</h3>' +
      '<p class="desc">' + (p.description || '설명 없음') + '</p>' +
      '<div class="meta">' +
        '<span class="badge badge-' + p.status + '">' + (statusLabels[p.status] || p.status) + '</span>' +
        '<span class="meta-item">' + p.slides + '장</span>' +
        (p.has_pptx ? '<span class="meta-item">PPTX</span>' : '') +
        '<span class="meta-item">' + formatDate(p.created) + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

loadNavUser();
loadProjects();
</script>
</body>
</html>
