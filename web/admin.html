<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 - Slide Studio</title>
<style>html{background:#151515}</style>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="masthead">
  <div class="masthead-brand">
    <a href="/" class="masthead-home-link">
      <span class="rh-mark"></span>
      <span class="masthead-title">Slide Studio</span>
    </a>
    <span class="masthead-context">Slide Studio</span>
  </div>
  <nav class="masthead-nav">
    <a href="/" class="masthead-nav-link">대시보드</a>
  </nav>
  <div class="nav-user" id="navUser"></div>
</div>

<div class="page-hero">
  <div class="page-eyebrow">Slide Studio</div>
  <h1>관리자 대시보드</h1>
  <div class="page-subheading">가입 신청 및 계정 접근 권한을 관리하세요.</div>
</div>

  <main class="content">
    <div class="content-inner">
      <div class="card">
        <h2 style="margin:0 0 16px">사용자 승인 관리</h2>
        <div id="loading" class="empty">불러오는 중...</div>

        <div class="table-scroll">
          <table class="jobs-table" id="usersTable" style="display:none">
            <thead>
              <tr>
                <th>접속 ID (이메일)</th>
                <th>수신 메일</th>
                <th>역할</th>
                <th>상태</th>
                <th>가입 신청일</th>
                <th class="text-center">작업</th>
              </tr>
            </thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

<script>
const STATUS_LABEL = { pending: '승인 대기', approved: '승인됨', rejected: '차단됨' };
const STATUS_BADGE = { pending: 'badge-pending', approved: 'badge-completed', rejected: 'badge-failed' };
const ICON_SHIELD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg>';
const ICON_LOGOUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h4"/><path d="M15 16l4-4-4-4"/><path d="M19 12H9"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
const ICON_BAN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.5 5.5l13 13"/></svg>';
const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';
const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>';

async function requireAdmin() {
  try {
    const res = await fetch('/api/me');
    if (!res.ok) { window.location.href = '/login'; return null; }
    const me = await res.json();
    if (me.role !== 'admin') { window.location.href = '/'; return null; }
    document.getElementById('navUser').innerHTML =
      '<span class="avatar">' + me.email.charAt(0).toUpperCase() + '</span>' +
      '<span class="email">' + me.email + '</span>' +
      '<a href="/admin" title="관리자 페이지">' + ICON_SHIELD + '관리자</a>' +
      '<a href="#" onclick="logout(); return false;" title="로그아웃">' + ICON_LOGOUT + '로그아웃</a>';
    return me;
  } catch (e) {
    window.location.href = '/login';
    return null;
  }
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login';
}

let usersCache = [];
let editingEmail = null;

async function loadUsers() {
  try {
    const res = await fetch('/api/admin/users');
    if (!res.ok) return;
    usersCache = await res.json();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('usersTable').style.display = 'table';
    renderUsers();
  } catch (e) {
    document.getElementById('loading').textContent = '목록을 불러올 수 없습니다.';
  }
}

function renderUsers() {
  const tbody = document.getElementById('usersBody');
  tbody.innerHTML = usersCache.map(u => u.email === editingEmail ? renderEditRow(u) : renderRow(u)).join('');
}

function renderRow(u) {
  return '<tr>' +
    '<td title="' + esc(u.email) + '">' + esc(u.email) + '</td>' +
    '<td title="' + esc(u.notify_email) + '">' + esc(u.notify_email) + '</td>' +
    '<td>' + (u.role === 'admin' ? '관리자' : '사용자') + '</td>' +
    '<td><span class="badge ' + STATUS_BADGE[u.status] + '">' + (STATUS_LABEL[u.status] || u.status) + '</span></td>' +
    '<td>' + formatDate(u.created_at) + '</td>' +
    '<td class="actions-cell">' + renderActions(u) + '</td>' +
    '</tr>';
}

function renderEditRow(u) {
  return '<tr>' +
    '<td class="wrap"><input type="email" id="editEmail" value="' + esc(u.email) + '"></td>' +
    '<td class="wrap"><input type="email" id="editNotifyEmail" value="' + esc(u.notify_email) + '"></td>' +
    '<td>' + (u.role === 'admin' ? '관리자' : '사용자') + '</td>' +
    '<td><span class="badge ' + STATUS_BADGE[u.status] + '">' + (STATUS_LABEL[u.status] || u.status) + '</span></td>' +
    '<td>' + formatDate(u.created_at) + '</td>' +
    '<td class="actions-cell"><div class="row-actions">' +
    '<button class="btn btn-sm btn-primary" onclick="saveEdit(\'' + u.email + '\')">' + ICON_CHECK + '저장</button>' +
    '<button class="btn btn-sm btn-outline" onclick="cancelEdit()">' + ICON_X + '취소</button>' +
    '</div></td></tr>';
}

function renderActions(u) {
  const buttons = [];
  if (u.role !== 'admin') {
    if (u.status !== 'approved')
      buttons.push('<button class="btn btn-sm btn-outline" onclick="setStatus(\'' + u.email + '\', \'approve\')">' + ICON_CHECK + '승인</button>');
    if (u.status !== 'rejected')
      buttons.push('<button class="btn btn-sm btn-danger" onclick="setStatus(\'' + u.email + '\', \'reject\')">' + ICON_BAN + (u.status === 'approved' ? '접근 차단' : '거부') + '</button>');
  }
  buttons.push('<button class="btn btn-sm btn-outline" onclick="startEdit(\'' + u.email + '\')">' + ICON_EDIT + '수정</button>');
  if (u.role !== 'admin')
    buttons.push('<button class="btn btn-sm btn-danger" onclick="deleteUser(\'' + u.email + '\')">' + ICON_TRASH + '삭제</button>');
  return '<div class="row-actions">' + buttons.join('') + '</div>';
}

function startEdit(email) { editingEmail = email; renderUsers(); }
function cancelEdit() { editingEmail = null; renderUsers(); }

async function saveEdit(email) {
  const newEmail = document.getElementById('editEmail').value.trim();
  const notifyEmail = document.getElementById('editNotifyEmail').value.trim();
  try {
    const fd = new FormData();
    if (newEmail && newEmail !== email) fd.append('new_email', newEmail);
    if (notifyEmail) fd.append('notify_email', notifyEmail);
    const res = await fetch('/api/admin/users/' + encodeURIComponent(email) + '/edit', { method: 'POST', body: fd });
    if (!res.ok) { const data = await res.json(); alert(data.detail || '수정 실패'); return; }
    editingEmail = null;
    loadUsers();
  } catch (e) { alert('서버 연결 실패'); }
}

async function deleteUser(email) {
  if (!confirm(email + ' 계정을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) return;
  try {
    const res = await fetch('/api/admin/users/' + encodeURIComponent(email), { method: 'DELETE' });
    if (!res.ok) { const data = await res.json(); alert(data.detail || '삭제 실패'); return; }
    loadUsers();
  } catch (e) { alert('서버 연결 실패'); }
}

async function setStatus(email, action) {
  try {
    const res = await fetch('/api/admin/users/' + encodeURIComponent(email) + '/' + action, { method: 'POST' });
    if (!res.ok) { const data = await res.json(); alert(data.detail || '처리 실패'); return; }
    loadUsers();
  } catch (e) { alert('서버 연결 실패'); }
}

function formatDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}

function esc(s) {
  const el = document.createElement('span');
  el.textContent = s;
  return el.innerHTML;
}

(async () => {
  const me = await requireAdmin();
  if (me) loadUsers();
})();
</script>

</body>
</html>
